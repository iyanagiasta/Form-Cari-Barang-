<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06395a">
<meta name="color-scheme" content="light">
<title>Cari Barang Gudang</title>
<style>
  :root {
    color-scheme: light;
    --laut-tua: #06395a;
    --laut: #0b6e99;
    --aqua: #19b5c8;
    --aqua-teks: #04293f;
    --bg: #f1f7fa;
    --kartu: #ffffff;
    --teks: #14232d;
    --redup: #53687a;
    --garis: #d6e4ec;
    --aksen: var(--laut);
    --aksen-teks: #ffffff;
    --aksen-lembut: #e3f3f8;
    --peringatan: #8a4b08;
    --peringatan-bg: #fff3dc;
    --galat: #9b1c1c;
    --galat-bg: #fde8e8;
    --radius: 14px;
    --tinggi-ticker: 38px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--teks);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Kepala halaman ---------- */
  .kepala {
    position: relative;
    background: linear-gradient(135deg, var(--laut-tua) 0%, var(--laut) 100%);
    color: #fff;
    padding-bottom: 34px;
  }
  .bar { display: flex; align-items: center; gap: 12px; padding: 14px 0 4px; }
  .logo {
    width: 68px; height: 68px; flex-shrink: 0;
    border-radius: 14px; background: #fff; color: var(--laut);
    display: flex; align-items: center; justify-content: center; padding: 5px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
  }
  .logo img, .logo svg { max-width: 100%; max-height: 100%; display: block; }
  .logo svg { width: 62%; height: 62%; }
  .merek b { display: block; font-size: .92rem; letter-spacing: .06em; line-height: 1.2; }
  .merek span { display: block; margin-top: 2px; font-size: .74rem; opacity: .85; letter-spacing: .16em; text-transform: uppercase; }
  .hero { padding: 16px 0 6px; }
  .hero h1 { margin: 0; font-size: 1.75rem; line-height: 1.12; letter-spacing: .01em; }
  .hero p { margin: 4px 0 14px; opacity: .92; font-size: .95rem; }
  #form { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px;
    padding: 14px 16px;
    border: 0; border-radius: 12px;
    background: #fff; color: var(--teks);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    -webkit-appearance: none; appearance: none;
  }
  input[type=search]::placeholder { color: #6b7f8d; }
  input[type=search]:focus { outline: 3px solid var(--aqua); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; }
  .btn-cari {
    padding: 0 24px; border: 0; border-radius: 12px;
    background: var(--aqua); color: var(--aqua-teks); font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
  }
  .btn-cari:active { filter: brightness(.92); }
  button:focus-visible, .foto.ada:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
  /* ---------- Daftar saran saat mengetik ---------- */
  .cari-wrap { position: relative; }
  .saran {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
    background: #fff; color: var(--teks); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(3, 20, 32, .38);
    max-height: min(46vh, 380px); overflow-y: auto;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .saran[hidden] { display: none; }
  .saran-ket, .saran-label {
    position: sticky; top: 0; z-index: 1;
    padding: 8px 14px; font-size: .78rem; color: var(--redup);
    background: #eef6f9; border-bottom: 1px solid var(--garis);
  }
  .saran-label { position: static; background: #fff8e6; color: var(--peringatan); border-top: 1px solid var(--garis); }
  .saran-kosong { padding: 14px; color: var(--redup); font-size: .92rem; }
  .saran-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 12px 14px; border-top: 1px solid var(--garis); cursor: pointer;
  }
  .saran-ket + .saran-item, .saran-label + .saran-item { border-top: 0; }
  .saran-item:hover, .saran-item.aktif { background: var(--aksen-lembut); }
  .saran-item .n { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .saran-item .n b { color: var(--laut); font-weight: 700; }
  .saran-item small { flex-shrink: 0; text-align: right; color: var(--redup); font-size: .78rem; }
  .jumlah { display: block; margin-top: 10px; font-size: .8rem; opacity: .85; min-height: 1.2em; }
  .ombak { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 30px; display: block; }
  .ombak .o1 { fill: rgba(25, 181, 200, .35); }
  .ombak .o2 { fill: var(--bg); }

  main.wrap { padding-top: 6px; padding-bottom: calc(var(--tinggi-nyata, calc(var(--tinggi-ticker) + env(safe-area-inset-bottom, 0px))) + 72px); }

  /* ---------- Info / pesan ---------- */
  .info { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--aksen-lembut); font-size: .92rem; }
  .info.peringatan { background: var(--peringatan-bg); color: var(--peringatan); }
  .info.galat { background: var(--galat-bg); color: var(--galat); }
  .info button { margin-left: 8px; padding: 4px 10px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; }
  .info:empty { display: none; }
  .judul-hasil { margin: 4px 0 10px; font-size: .92rem; color: var(--redup); }

  /* ---------- Kartu barang ---------- */
  .kartu {
    background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(6, 57, 90, .06);
  }
  .kartu .atas { display: grid; grid-template-columns: 1fr; }
  .kartu .isi { padding: 14px; }
  .kartu h3 { margin: 0; font-size: 1.15rem; line-height: 1.25; color: var(--laut-tua); }
  .kartu .meta { margin: 2px 0 0; color: var(--redup); font-size: .88rem; }

  .lokasi { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .chip {
    flex: 1 1 0; min-width: 84px;
    background: var(--aksen-lembut); border-radius: 12px; padding: 8px 10px; text-align: center;
    border-bottom: 3px solid var(--aqua);
  }
  .chip small { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .chip b { display: block; font-size: 1.6rem; line-height: 1.15; color: var(--laut); word-break: break-word; }
  .dekat { margin: 8px 0 0; font-size: 1rem; }
  .dekat svg { vertical-align: -3px; margin-right: 4px; color: var(--laut); }
  .rak-info { margin: 2px 0 0; color: var(--redup); font-size: .88rem; }
  .tambahan { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .tambahan span { background: var(--bg); border: 1px solid var(--garis); border-radius: 999px; padding: 2px 10px; font-size: .82rem; color: var(--redup); }
  .tambahan b { color: var(--teks); font-weight: 600; }

  .stok { margin: 8px 0 0; font-weight: 600; color: var(--laut-tua); }
  .stok.menipis { color: var(--peringatan); }
  .stok.habis { color: var(--galat); }

  .foto-baris { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--garis); }
  .foto-blok { padding: 12px 14px; }
  .foto-blok + .foto-blok { border-top: 1px solid var(--garis); }
  .foto-blok h4 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .foto {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    border-radius: 10px; overflow: hidden; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  }
  .foto.ada { cursor: zoom-in; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto.kosong { border: 1.5px dashed var(--garis); color: var(--redup); font-size: .85rem; }
  .foto.kosong svg { opacity: .7; }

  .aksi { padding: 0 14px 14px; }
  .btn-rak {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid var(--laut); background: transparent; color: var(--laut); font-weight: 600;
  }
  .btn-rak:active { background: var(--aksen-lembut); }
  .btn-rak:disabled { opacity: .55; cursor: wait; }

  .admin-aksi { display: flex; gap: 8px; padding: 0 14px 14px; flex-wrap: wrap; }
  .admin-aksi .btn-rak { flex: 1 1 140px; width: auto; background: var(--aksen-lembut); }
  .peringatan-data { margin: 0 14px 10px; padding: 10px 12px; border-radius: 10px; background: var(--peringatan-bg); color: var(--peringatan); font-size: .88rem; }
  .peringatan-data b { display: block; margin-bottom: 2px; }
  .peringatan-data ul { margin: 0; padding-left: 18px; }
  .masalah-ket { margin: 4px 0 0; font-size: .82rem; color: var(--peringatan); text-align: left; }
  /* ---------- Kotak pencarian + tombol hapus (x) ---------- */
  .kotak-input { position: relative; flex: 1; min-width: 0; display: flex; }
  .kotak-input input[type=search] { flex: 1; padding-right: 54px; }
  input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .hapus-q { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; padding: 0; border: 0; border-radius: 999px; background: var(--aksen-lembut); color: var(--laut); font-size: 1.6rem; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .hapus-q[hidden] { display: none; }

  /* ---------- Formulir (lembar dari bawah di HP, kotak di tengah di layar lebar) ---------- */
  .modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(3, 20, 32, .6); align-items: flex-end; justify-content: center; }
  .modal.buka { display: flex; }
  #pilihRak { z-index: 50; }
  .form-kotak, .rak-sheet { width: 100%; max-width: 560px; display: flex; flex-direction: column; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 32px rgba(3, 20, 32, .4); overflow: hidden; }
  .form-kotak { max-height: 94vh; max-height: 94dvh; }
  .rak-sheet { height: min(88vh, 640px); }
  @media (min-width: 600px) { .modal { align-items: center; } .form-kotak, .rak-sheet { border-radius: var(--radius); } }
  .sheet-kepala { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
  .sheet-kepala h3 { margin: 0; font-size: 1.2rem; color: var(--laut-tua); }
  .sheet-x { width: 44px; height: 44px; flex-shrink: 0; padding: 0; border: 0; border-radius: 999px; background: var(--aksen-lembut); color: var(--laut); font-size: 1.6rem; line-height: 1; }
  .form-isi { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .form-isi .meta { margin: 0 0 8px; }
  .bagian { margin-top: 14px; }
  .bagian h4, .lipat summary { margin: 0 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .lipat { margin-top: 14px; border-top: 1px solid var(--garis); padding-top: 6px; }
  .lipat summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
  .field { margin: 10px 0 0; }
  .field label { display: block; margin: 0 0 4px; font-size: .85rem; font-weight: 600; color: var(--redup); }
  .field input[type=text] { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; background: #fff; color: var(--teks); }
  .field input[type=text]:focus, .rak-baru input:focus, .rak-sheet > input:focus { outline: 3px solid var(--aqua); outline-offset: 1px; }
  .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rak-tombol { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1.5px solid var(--laut); border-radius: 10px; background: var(--aksen-lembut); color: var(--laut-tua); font-weight: 700; text-align: left; }
  .pratinjau { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--aksen-lembut); font-size: .9rem; line-height: 1.5; }
  .pratinjau b { color: var(--laut-tua); }
  .form-kaki { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--garis); background: #fff; }
  .form-galat { color: var(--galat); font-size: .9rem; margin-bottom: 8px; }
  .form-galat:empty { display: none; }
  .form-tombol { display: flex; gap: 8px; }
  .form-tombol button { flex: 1; min-height: 48px; border-radius: 10px; font-weight: 700; border: 1.5px solid var(--laut); background: transparent; color: var(--laut); }
  .form-tombol button[type=submit] { flex: 2; background: var(--laut); color: #fff; }
  .form-tombol button:disabled { opacity: .6; cursor: wait; }
  .rak-sheet > input[type=search] { margin: 0 16px 8px; width: calc(100% - 32px); flex: none; min-height: 48px; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; box-shadow: none; }
  .rak-pilih { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; align-content: flex-start; }
  .rak-opsi { flex: 1 1 140px; min-height: 56px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--garis); background: var(--bg); color: var(--teks); text-align: left; line-height: 1.2; }
  .rak-opsi b { display: block; font-size: 1.05rem; color: var(--laut); }
  .rak-opsi small { color: var(--redup); }
  .rak-opsi.dipakai { border-color: var(--laut); background: var(--aksen-lembut); }
  .sheet-label { margin: 6px 16px 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .rak-baru { display: flex; gap: 8px; padding: 0 16px; }
  .rak-baru input { flex: 1; min-width: 0; min-height: 48px; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; }
  .rak-baru button { padding: 0 20px; border-radius: 10px; border: 0; background: var(--laut); color: #fff; font-weight: 700; }
  .rak-kosong { margin: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); min-height: 48px; border-radius: 10px; border: 1.5px dashed var(--garis); background: transparent; color: var(--redup); }
  .admin-bar .tambah { display: inline-block; margin-right: 14px; color: var(--laut); font-weight: 600; }
  .admin-bar { margin: 16px 0 0; text-align: center; }
  .admin-bar .periksa { display: inline-block; margin-right: 14px; color: var(--peringatan); font-weight: 600; }
  .admin-bar button { border: 0; background: transparent; color: var(--redup); font-size: .8rem; text-decoration: underline; }

  @media (min-width: 600px) {
    .foto-baris { grid-template-columns: 1fr 1fr; }
    .foto-blok + .foto-blok { border-top: 0; border-left: 1px solid var(--garis); }
    .hero h1 { font-size: 2.1rem; }
  }

  /* ---------- Tampilan isi rak ---------- */
  .rak-judul { margin: 0 0 4px; font-size: 1.3rem; color: var(--laut-tua); }
  .btn-kembali { border: 0; background: transparent; color: var(--laut); padding: 4px 0; margin-bottom: 8px; font-weight: 600; }
  .tingkat { background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--radius); margin: 12px 0; overflow: hidden; }
  .tingkat > h4 { margin: 0; padding: 10px 14px; background: var(--aksen-lembut); font-size: .95rem; color: var(--laut-tua); }
  .tingkat .foto { border-radius: 0; aspect-ratio: 16 / 9; }
  .baris {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
    width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
    padding: 10px 14px; border-top: 1px solid var(--garis);
  }
  .baris:active { background: var(--aksen-lembut); }
  .baris .nama { font-weight: 600; }
  .baris .ket { color: var(--redup); font-size: .85rem; text-align: right; flex-shrink: 0; }

  /* ---------- Telusuri per rak ---------- */
  details.rak-nav { margin-top: 18px; background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--radius); padding: 12px 14px; }
  details.rak-nav summary { cursor: pointer; font-weight: 600; color: var(--laut-tua); }
  .rak-daftar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .rak-daftar button {
    padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--garis);
    background: var(--bg); color: var(--teks); text-align: left; line-height: 1.2;
  }
  .rak-daftar button b { display: block; font-size: 1.05rem; color: var(--laut); }
  .rak-daftar button small { color: var(--redup); }

  /* ---------- Teks berjalan ---------- */
  .ticker {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    height: calc(var(--tinggi-ticker) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--laut-tua); color: #fff;
    border-top: 2px solid var(--aqua);
    overflow: hidden; display: flex; align-items: center;
  }
  .ticker .track { display: flex; flex-wrap: nowrap; white-space: nowrap; will-change: transform; animation: jalan var(--durasi, 40s) linear infinite; }
  .ticker .grup { display: flex; flex-shrink: 0; }
  .ticker .unit { font-size: .82rem; letter-spacing: .05em; }
  .ticker:hover .track, .ticker.jeda .track { animation-play-state: paused; }
  @keyframes jalan { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    .ticker { height: auto; min-height: var(--tinggi-ticker); padding: 7px 16px; }
    .ticker .track { animation: none; white-space: normal; }
    .ticker .grup + .grup { display: none; }
    .ticker .grup .unit:not(:first-child) { display: none; }
  }

  /* ---------- Foto layar penuh ---------- */
  #lightbox {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(3, 20, 32, .9); align-items: center; justify-content: center; padding: 16px; flex-direction: column; gap: 10px;
  }
  #lightbox.buka { display: flex; }
  #lightbox img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
  #lightbox p { color: #fff; margin: 0; font-size: .9rem; }
  #lightbox button { position: absolute; top: 12px; right: 12px; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 1.4rem; background: #fff; color: #000; }
</style>
</head>
<body>

<header class="kepala">
  <div class="wrap">
    <div class="bar">
      <div class="logo" id="logo" aria-hidden="true"></div>
      <div class="merek"><b id="perusahaan"></b><span id="bagian"></span></div>
    </div>
    <div class="hero">
      <h1 id="judul"></h1>
      <p id="tagline"></p>
      <div class="cari-wrap" id="cariWrap">
        <form id="form" role="search" autocomplete="off">
          <div class="kotak-input">
          <input id="q" type="search" name="q" placeholder="Ketik nama barang…" aria-label="Nama barang"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="saran"
                 enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false">
          <button type="button" id="hapusQ" class="hapus-q" aria-label="Hapus teks pencarian" hidden>×</button>
          </div>
          <button class="btn-cari" type="submit">Cari</button>
        </form>
        <div id="saran" class="saran" role="listbox" aria-label="Saran nama barang" hidden></div>
      </div>
      <small class="jumlah" id="subjudul"></small>
    </div>
  </div>
  <svg class="ombak" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path class="o1" d="M0,28 C240,62 480,-4 720,28 C960,60 1200,-2 1440,28 L1440,60 L0,60Z"/>
    <path class="o2" d="M0,40 C260,10 520,62 780,38 C1040,12 1240,54 1440,34 L1440,60 L0,60Z"/>
  </svg>
</header>

<main class="wrap">
  <div id="stale" class="info peringatan"></div>
  <div id="info" class="info" role="status" aria-live="polite"></div>
  <div id="hasil"></div>
  <details id="rakNav" class="rak-nav" open></details>
  <div id="adminBar" class="admin-bar"></div>
  <noscript><p class="info galat">Halaman ini membutuhkan JavaScript agar bisa dipakai.</p></noscript>
</main>

<div class="ticker" id="ticker" role="region" aria-label="Pemberitahuan"></div>

<div id="pilihRak" class="modal" role="dialog" aria-modal="true" aria-label="Pilih rak"></div>
<div id="formModal" class="modal" role="dialog" aria-modal="true" aria-label="Formulir"></div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto diperbesar">
  <button type="button" id="tutupFoto" aria-label="Tutup foto">×</button>
  <img id="fotoBesar" alt="">
  <p id="fotoKet"></p>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================
     PENGATURAN — hanya bagian ini yang perlu Anda ubah
     ===================================================== */

  function cari(q) {
    var kata = norm(q).split(' ').filter(Boolean);
    if (!kata.length) { return []; }
    var utuh = kata.join(' ');
    var rapat = utuh.replace(/ /g, '');
    var hasil = [];
    semua.forEach(function (it) {
      var gabung = it._h + ' ' + it._i;
      var cocokKata = true;
      for (var i = 0; i < kata.length; i++) {
        if (gabung.indexOf(kata[i]) === -1) { cocokKata = false; break; }
      }
      var cocokRapat = rapat.length >= 3 && it._hr.indexOf(rapat) !== -1;
      if (!cocokKata && !cocokRapat) { return; }

      var skor = 4;
      var semuaDiNama = true;
      for (var j = 0; j < kata.length; j++) {
        if (it._h.indexOf(kata[j]) === -1) { semuaDiNama = false; break; }
      }
      var diNama = semuaDiNama || (rapat.length >= 3 && it._hn.indexOf(rapat) !== -1);
      if (diNama) { skor = 3; }
      if (it._n === utuh) { skor = 0; }
      else if (it._n.indexOf(utuh) === 0) { skor = 1; }
      else if (diNama && (' ' + it._n).indexOf(' ' + kata[0]) !== -1) { skor = 2; }
      hasil.push({ it: it, skor: skor });
    });
    hasil.sort(function (a, b) {
      return a.skor - b.skor || a.it.nama.localeCompare(b.it.nama, 'id', { numeric: true });
    });
    return hasil.map(function (h) { return h.it; });
  }

  /* ---------- Toleransi salah ketik ---------- */

  function lev(a, b) {
    var al = a.length, bl = b.length, i, j;
    if (!al) { return bl; }
    if (!bl) { return al; }
    var d = [];
    for (i = 0; i <= al; i++) { d[i] = [i]; }
    for (j = 0; j <= bl; j++) { d[0][j] = j; }
    for (i = 1; i <= al; i++) {
      for (j = 1; j <= bl; j++) {
        var c = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
        if (i > 1 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
          d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
        }
      }
    }
    return d[al][bl];
  }

  function cariKira(q, sudah) {
    var kata = norm(q).split(' ').filter(Boolean);
    var adaPanjang = kata.some(function (k) { return k.length >= 4; });
    if (!kata.length || !adaPanjang) { return []; }
    var lewat = {};
    (sudah || []).forEach(function (it) { lewat[it._id] = true; });
    var hasil = [];
    semua.forEach(function (it) {
      if (lewat[it._id]) { return; }
      var gabung = it._h + ' ' + it._i;
      var kataItem = gabung.split(' ').filter(Boolean);
      var jarak = 0;
      for (var i = 0; i < kata.length; i++) {
        var k = kata[i];
        if (k.length < 4) {
          if (gabung.indexOf(k) === -1) { return; }
          continue;
        }
        var tol = k.length >= 7 ? 2 : 1;
        var terbaik = 99;
        for (var j = 0; j < kataItem.length; j++) {
          var w = kataItem[j];
          var dd = lev(k, w);
          if (w.length > k.length) { dd = Math.min(dd, lev(k, w.slice(0, k.length))); }
          if (dd < terbaik) { terbaik = dd; }
        }
        if (terbaik > tol) { return; }
        jarak += terbaik;
      }
      hasil.push({ it: it, jarak: jarak });
    });
    hasil.sort(function (a, b) { return a.jarak - b.jarak || a.it.nama.localeCompare(b.it.nama, 'id', { numeric: true }); });
    return hasil.map(function (h) { return h.it; });
  }

  function tampilHasil(q, semuaHasil) {
    terakhir = { jenis: 'cari', q: q, semua: !!semuaHasil };
    perbaruiHapusQ();
    var box = $('hasil');
    box.innerHTML = '';
    $('rakNav').open = false;

      setInfo('Ketik nama barang dulu, lalu klik Cari.');
      $('rakNav').open = true;
      return;

      $('rakNav').open = true;
      return;
    }

    setInfo('');

    box.appendChild(el('p', { class: 'judul-hasil', text: hasil.length + ' barang ditemukan' }));

  /* ---------- Tampilan: isi satu rak ---------- */

  function tampilRak(rakId, dariHasil) {
    terakhir = { jenis: 'rak', rak: rakId };
    perbaruiHapusQ();
    var kunci = norm(bersihAwalan(rakId, 'rak'));
    var isi = semua.filter(function (it) { return it._r === kunci; });
    var box = $('hasil');
    box.innerHTML = '';
    $('rakNav').open = false;
    setInfo('');

    if (!isi.length) {
      setInfo('Rak "' + rakId + '" tidak ditemukan atau belum ada isinya.', 'peringatan');
      $('rakNav').open = true;
      return;
    }

    var nama = bersihAwalan(rakId, 'rak');
    var kembali = el('button', {
      type: 'button', class: 'btn-kembali',
      text: dariHasil && $('q').value.trim() ? '← Kembali ke hasil pencarian' : '← Kembali',
      onclick: function () {
        if ($('q').value.trim()) { tampilHasil($('q').value); } else { beranda(); }
      }
    });
    box.appendChild(kembali);
    box.appendChild(el('h2', { class: 'rak-judul', text: 'Rak ' + nama }));
    var ket = [isi[0].rakNama, isi[0].rakLokasi].filter(Boolean).join(' — ');
    box.appendChild(el('p', { class: 'meta', text: (ket ? ket + ' · ' : '') + isi.length + ' barang' }));

    var kelompok = {};
    var urutan = [];
    isi.forEach(function (it) {
      var t = bersihAwalan(it.tingkat || '', 'tingkat') || '-';
      if (!kelompok[t]) { kelompok[t] = []; urutan.push(t); }
      kelompok[t].push(it);
    });
    urutan.sort(function (a, b) { return a.localeCompare(b, 'id', { numeric: true }); });

    urutan.forEach(function (t) {
      var daftar = kelompok[t].slice().sort(function (a, b) {
        return String(a.kolom).localeCompare(String(b.kolom), 'id', { numeric: true }) || a.nama.localeCompare(b.nama, 'id');
      });
      var fotoTingkat = '';
      daftar.forEach(function (it) { if (!fotoTingkat && it.fotoTingkat) { fotoTingkat = it.fotoTingkat; } });

      var blok = el('section', { class: 'tingkat' }, [
        el('h4', { text: t === '-' ? 'Tingkat belum diisi' : 'Tingkat ' + t + ' · ' + daftar.length + ' barang' })
      ]);
      if (fotoTingkat) { blok.appendChild(fotoEl(fotoTingkat, 'Foto rak')); }
      daftar.forEach(function (it) {
        var ketBaris = [it.kolom ? 'kolom ' + bersihAwalan(it.kolom, 'kolom') : '', it.dekat ? 'dekat ' + it.dekat : '']
          .filter(Boolean).join(' · ');
        blok.appendChild(el('button', {
          type: 'button', class: 'baris',
          onclick: function () { $('q').value = it.nama; tutupSaran(); tampilSatu(it); }
        }, [
          el('span', { class: 'nama', text: it.nama }),
          el('span', { class: 'ket', text: ketBaris })
        ]));
      });
      box.appendChild(blok);
    });
    window.scrollTo(0, 0);
  }

  // Kecilkan foto: JPEG, sisi terpanjang <= UKURAN_MAKS, kualitas turun bertahap sampai <= TARGET_KB
  function kecilkan(file) {
    return new Promise(function (ok, gagal) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onerror = function () { URL.revokeObjectURL(url); gagal(new Error('File bukan gambar yang valid.')); };
      img.onload = function () {
        URL.revokeObjectURL(url);
        var sisi = UKURAN_MAKS, kual = 0.8;
        (function coba() {
          var skala = Math.min(1, sisi / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * skala);
          c.height = Math.round(img.naturalHeight * skala);
          var g = c.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) {
            if (!b) { gagal(new Error('Gagal memproses foto.')); return; }
            var kb = b.size / 1024;
            if (kb > TARGET_KB && kual > 0.5) { kual -= 0.1; coba(); return; }
            if (kb > TARGET_KB && sisi > 700) { sisi -= 150; kual = 0.7; coba(); return; }
            ok(b);
          }, 'image/jpeg', kual);
        })();
      };
      img.src = url;
    });
  }

  function keBase64(blob) {
    return new Promise(function (ok, gagal) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1]); };
      r.onerror = function () { gagal(new Error('Gagal membaca foto.')); };
      r.readAsDataURL(blob);
    });
  }

  function pilihFoto(it, jenis) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () { if (inp.files && inp.files[0]) { unggah(it, jenis, inp.files[0]); } };
    inp.click();
  }

  function unggah(it, jenis, file) {
    setInfo('Mengecilkan foto…');
    var tk = norm(bersihAwalan(it.tingkat, 'tingkat'));
    kecilkan(file).then(function (blob) {
      setInfo('Mengunggah (' + Math.round(blob.size / 1024) + ' KB)…');
      return keBase64(blob).then(function (b64) {
        return kirimKeServer({
          aksi: 'foto', admin: kodeAdmin, jenis: jenis, kode: it.kode,
          rak: bersihAwalan(it.rak, 'rak'), tingkat: bersihAwalan(it.tingkat, 'tingkat'), data: b64
        });
      });
    }).then(function (d) {
      if (!d.ok) { var e = new Error(d.pesan || 'Gagal menyimpan foto.'); e.kode = d.error; throw e; }
      var bust = d.url + '&t=' + Date.now(); // paksa browser memuat foto terbaru
      semua.forEach(function (x) {
        if (jenis === 'barang' && x.kode === it.kode) { x.fotoBarang = bust; }
        if (jenis === 'rak' && x._r === it._r && norm(bersihAwalan(x.tingkat, 'tingkat')) === tk) { x.fotoRak = bust; }
        if (jenis === 'lokasi' && x.kode === it.kode) { x.fotoRak = bust; x.fotoLokasi = true; }
      });
      simpanLokal(semua);
      segarkanTampilan();
      setInfo('Foto tersimpan: ' + d.nama, '');
    }).catch(function (err) {
      if (err && err.kode === 'ADMIN_SALAH') { keluarAdmin(); }
      setInfo('Upload gagal: ' + (err && err.message ? err.message : err), 'galat');
    });
  }

  /* ---------- Edit info, pindah posisi, tambah barang ---------- */

  var KUNCI_PENGUBAH = 'gudang_pengubah_v1';
  var KUNCI_POSISI = { rak: 1, rak_id: 1, tingkat: 1, kolom: 1 };

  function nilaiKolom(it, c) {
    var k = c.k;
    if (c.wajib) { return it.nama || ''; }
    if (k === 'kategori') { return it.kategori || ''; }
    if (k === 'kata_kunci') { return it.kataKunci || ''; }
    if (k === 'dekat_dengan' || k === 'dekat') { return it.dekat || ''; }
    if (k === 'rak' || k === 'rak_id') { return it.rak || ''; }
    if (k === 'tingkat') { return it.tingkat || ''; }
    if (k === 'kolom') { return it.kolom || ''; }
    if (k === 'stok') { return it.stok || ''; }
    if (k === 'satuan') { return it.satuan || ''; }
    if (k === 'stok_min') { return it.stokMin || ''; }
    return (it.info && it.info[c.label]) || '';
  }

  function perbaruiHapusQ() { $('hapusQ').hidden = !$('q').value; }

  function tutupPilihRak() {
    var p = $('pilihRak');
    p.classList.remove('buka');
    p.innerHTML = '';

  function tutupForm() {
    var m = $('formModal');
    m.classList.remove('buka');

  function lokasiTeks(rak, tingkat, kolom) {
    var p = [];
    if (rak) { p.push('Rak ' + bersihAwalan(rak, 'rak')); }
    if (tingkat) { p.push('Tingkat ' + bersihAwalan(tingkat, 'tingkat')); }
    if (kolom) { p.push('Kolom ' + bersihAwalan(kolom, 'kolom')); }
    return p.join(' · ') || 'belum diisi';
  }

  // tingkat/kolom dianggap angka kalau semua isi yang ada di data berupa angka
  function angkaSemua(f) {
    return semua.every(function (x) { var v = String(x[f] || '').trim(); return !v || /^\d+$/.test(v); });
  }

  function daftarRakPilihan() {
    var peta = {}, urut = [];
    semua.forEach(function (x) {
      var r = String(x.rak || '').trim();
      if (!r) { return; }
      var k = norm(r);
      if (!peta[k]) { peta[k] = { nilai: r, n: 0, nama: '' }; urut.push(k); }
      peta[k].n++;
      if (!peta[k].nama && x.rakNama) { peta[k].nama = x.rakNama; }
    });
    return urut.map(function (k) { return peta[k]; })
      .sort(function (a, b) { return a.nilai.localeCompare(b.nilai, 'id', { numeric: true }); });
  }

  // Layar pemilih rak: tombol besar + kotak cari + rak baru + kosongkan
  function bukaPilihRak(sekarang, onPilih) {
    var p = $('pilihRak');
    p.innerHTML = '';
    var sheet = el('div', { class: 'rak-sheet' });
    sheet.appendChild(el('div', { class: 'sheet-kepala' }, [
      el('h3', { text: 'Pilih rak' }),
      el('button', { type: 'button', class: 'sheet-x', 'aria-label': 'Tutup pilihan rak', text: '×', onclick: tutupPilihRak })
    ]));
    var cariInp = el('input', { type: 'search', placeholder: 'Cari rak…', 'aria-label': 'Cari rak', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'search' });
    var daftar = el('div', { class: 'rak-pilih' });
    var semuaRak = daftarRakPilihan();
    function pilih(v) { tutupPilihRak(); onPilih(v); }
    function gambar() {
      daftar.innerHTML = '';
      var q = norm(cariInp.value);
      var cocok = semuaRak.filter(function (r) { return !q || norm(r.nilai + ' ' + r.nama).indexOf(q) !== -1; });
      cocok.forEach(function (r) {
        daftar.appendChild(el('button', {
          type: 'button', class: 'rak-opsi' + (norm(r.nilai) === norm(sekarang) ? ' dipakai' : ''),
          onclick: function () { pilih(r.nilai); }
        }, [
          el('b', { text: 'Rak ' + bersihAwalan(r.nilai, 'rak') }),
          el('small', { text: (r.nama ? r.nama + ' · ' : '') + r.n + ' barang' })
        ]));
      });
      if (!cocok.length) { daftar.appendChild(el('p', { class: 'meta', text: 'Tidak ada rak yang cocok. Pakai "+ Rak baru" di bawah.' })); }
    }
    cariInp.addEventListener('input', gambar);
    var baruInp = el('input', { type: 'text', placeholder: 'Nama rak baru, misalnya F', 'aria-label': 'Nama rak baru', autocomplete: 'off', autocapitalize: 'characters' });
    sheet.appendChild(cariInp);
    sheet.appendChild(daftar);
    sheet.appendChild(el('p', { class: 'sheet-label', text: '+ Rak baru' }));
    sheet.appendChild(el('div', { class: 'rak-baru' }, [
      baruInp,
      el('button', { type: 'button', text: 'Pakai', onclick: function () { var v = baruInp.value.trim(); if (v) { pilih(v); } } })
    ]));
    sheet.appendChild(el('button', { type: 'button', class: 'rak-kosong', text: 'Kosongkan rak (lokasi belum diketahui)', onclick: function () { pilih(''); } }));
    p.appendChild(sheet);
    p.classList.add('buka');
    gambar();
  }

  // o: { judul, catatan, kolom, bagian:[{judul, kunci:[], lipat}], nilai, tombol, pratinjau(vals)->[lama, baru], onSimpan(vals, pengubah) }
  function bukaForm(o) {
    var m = $('formModal');
    m.innerHTML = '';
    var olehKunci = {};
    o.kolom.forEach(function (c) { olehKunci[c.k] = c; });
    var form = el('form', { class: 'form-kotak', autocomplete: 'off' });
    form.appendChild(el('div', { class: 'sheet-kepala' }, [
      el('h3', { text: o.judul }),
      el('button', { type: 'button', class: 'sheet-x', 'aria-label': 'Tutup formulir', text: '×', onclick: tutupForm })
    ]));
    var isi = el('div', { class: 'form-isi' });
    if (o.catatan) { isi.appendChild(el('p', { class: 'meta', text: o.catatan })); }
    var inputs = {};
    var pratinjau = o.pratinjau ? el('div', { class: 'pratinjau', 'aria-live': 'polite' }) : null;
    if (pratinjau) { isi.appendChild(pratinjau); }

    function segarPratinjau() {
      if (!pratinjau) { return; }
      var v = {};
      Object.keys(inputs).forEach(function (k) { v[k] = inputs[k].value.trim(); });
      var t = o.pratinjau(v);
      pratinjau.innerHTML = '';
      pratinjau.appendChild(el('div', {}, ['Sekarang: ', el('b', { text: t[0] })]));
      pratinjau.appendChild(el('div', {}, ['Menjadi: ', el('b', { text: t[1] })]));
    }

    function buatField(c) {
      var id = 'f-' + c.k;
      var nilai = (o.nilai && o.nilai[c.k]) || '';
      var kotak = el('div', { class: 'field' });
      if (c.k === 'rak' || c.k === 'rak_id') {
        var hid = el('input', { type: 'hidden', id: id, value: nilai });
        var tb = el('button', { type: 'button', class: 'rak-tombol', 'aria-label': c.label + ': pilih' });
        var isiTombol = function () {
          tb.innerHTML = '';
          tb.appendChild(el('span', { text: hid.value ? 'Rak ' + bersihAwalan(hid.value, 'rak') : 'Pilih rak…' }));
          tb.appendChild(el('span', { text: '▾', 'aria-hidden': 'true' }));
        };
        isiTombol();
        tb.addEventListener('click', function () {
          bukaPilihRak(hid.value, function (v) { hid.value = v; isiTombol(); segarPratinjau(); });
        });
        inputs[c.k] = hid;
        kotak.appendChild(el('label', { text: c.label + (c.wajib ? ' *' : ''), onclick: function () { tb.click(); } }));
        kotak.appendChild(hid);
        kotak.appendChild(tb);
        return kotak;
      }
      var props = { type: 'text', id: id, value: nilai };
      if (c.k === 'tingkat' || c.k === 'kolom') {
        props.autocapitalize = 'off';
        if (angkaSemua(c.k)) { props.inputmode = 'numeric'; }
      }
      var inp = el('input', props);
      inp.addEventListener('input', segarPratinjau);
      inputs[c.k] = inp;
      kotak.appendChild(el('label', { 'for': id, text: c.label + (c.wajib ? ' *' : '') }));
      kotak.appendChild(inp);
      return kotak;
    }

    o.bagian.forEach(function (b) {
      var ks = b.kunci.filter(function (k) { return olehKunci[k]; });
      if (!ks.length) { return; }
      var wadah;
      if (b.lipat) {
        wadah = el('details', { class: 'lipat' }, [el('summary', { text: b.judul })]);
        if (ks.some(function (k) { return o.nilai && o.nilai[k]; })) { wadah.open = true; }
      } else {
        wadah = el('section', { class: 'bagian' }, [el('h4', { text: b.judul })]);
      }
      var lewat = {};
      ks.forEach(function (k) {
        if (lewat[k]) { return; }
        if (k === 'tingkat' && ks.indexOf('kolom') !== -1) {
          lewat.kolom = true;
          wadah.appendChild(el('div', { class: 'dua' }, [buatField(olehKunci.tingkat), buatField(olehKunci.kolom)]));
        } else {
          wadah.appendChild(buatField(olehKunci[k]));
        }
      });
      isi.appendChild(wadah);
    });

    var simpanNama = '';
    try { simpanNama = localStorage.getItem(KUNCI_PENGUBAH) || ''; } catch (e) { /* abaikan */ }
    var peng = el('input', { type: 'text', id: 'f-pengubah', value: simpanNama, autocapitalize: 'words' });
    isi.appendChild(el('section', { class: 'bagian' }, [
      el('h4', { text: 'Pencatatan' }),
      el('div', { class: 'field' }, [el('label', { 'for': 'f-pengubah', text: 'Nama pengubah *' }), peng])
    ]));
    form.appendChild(isi);

    var galat = el('div', { class: 'form-galat', role: 'alert' });
    var simpan = el('button', { type: 'submit', text: o.tombol || 'Simpan' });
    form.appendChild(el('div', { class: 'form-kaki' }, [
      galat,
      el('div', { class: 'form-tombol' }, [el('button', { type: 'button', text: 'Batal', onclick: tutupForm }), simpan])
    ]));

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var vals = {};
      o.kolom.forEach(function (c) { if (inputs[c.k]) { vals[c.k] = inputs[c.k].value.trim(); } });
      var nama = peng.value.trim();
      if (!nama) { galat.textContent = 'Isi nama pengubah dulu.'; peng.focus(); return; }
      try { localStorage.setItem(KUNCI_PENGUBAH, nama); } catch (er) { /* abaikan */ }
      galat.textContent = '';
      simpan.disabled = true;
      simpan.textContent = 'Menyimpan…';
      new Promise(function (ok) { ok(o.onSimpan(vals, nama)); }).then(function () {
        tutupForm();
      }).catch(function (err) {
        simpan.disabled = false;
        simpan.textContent = o.tombol || 'Simpan';
        if (err && err.kode === 'ADMIN_SALAH') { tutupForm(); keluarAdmin(); setInfo('Kode admin ditolak server. Masuk mode admin lagi.', 'galat'); return; }
        if (err && err.batal) { return; }
        galat.textContent = (err && err.message) ? err.message : String(err);
      });
    });

    m.appendChild(form);
    m.classList.add('buka');
    document.body.style.overflow = 'hidden';
    segarPratinjau();
  }

  function kirimAksi(aksi, pengubah, kode, perubahan) {
    return kirimKeServer({ aksi: aksi, admin: kodeAdmin, pengubah: pengubah, kode: kode || '', perubahan: perubahan })
      .then(function (d) {
        if (!d.ok) { var e = new Error(d.pesan || 'Gagal menyimpan.'); e.kode = d.error; throw e; }
        return d;
      });
  }

  // Muat ulang data dari server (cache server sudah dihapus), lalu tampilkan barangnya
  function segarkanDariServer(kode, pesan, bikinTombol) {
    setInfo('Memuat ulang data…');
    return ambilDariServer().then(function (items) {
      semua = siapkan(items);
      simpanLokal(items);
      dataSiap();
      var it = semua.filter(function (x) { return String(x.kode) === String(kode); })[0];
      if (it) { $('q').value = it.nama; tampilSatu(it); }
      setInfo(pesan, '', it && bikinTombol ? bikinTombol(it) : null);
    }).catch(function (err) {
      setInfo('Tersimpan, tetapi gagal memuat ulang data: ' + (err && err.message ? err.message : err) + '. Buka ulang halaman.', 'peringatan');
    });
  }

  function butuhKolom() {
    if (!kolomForm.length) {
      window.alert('Daftar kolom belum dimuat dari server. Muat ulang halaman, pastikan Code.gs terbaru sudah dideploy, lalu coba lagi.');
      return false;
    }
    return true;
  }

  function kunciPosisi(kol) {
    var urut = function (c) { return (c.k === 'rak' || c.k === 'rak_id') ? 0 : c.k === 'tingkat' ? 1 : c.k === 'kolom' ? 2 : 3; };
    return kol.slice().sort(function (a, b) { return urut(a) - urut(b); }).map(function (c) { return c.k; });
  }

  function formEdit(it) {
    if (!butuhKolom()) { return; }
    var kol = kolomForm.filter(function (c) { return c.grup === 'info' || c.grup === 'dekat'; });
    var nilai = {};
    kol.forEach(function (c) { nilai[c.k] = nilaiKolom(it, c); });
    var utama = kol.filter(function (c) { return c.wajib || c.k === 'kategori'; }).map(function (c) { return c.k; });
    var lain = kol.map(function (c) { return c.k; }).filter(function (k) { return utama.indexOf(k) === -1; });
    bukaForm({
      judul: 'Edit info barang',
      catatan: 'Kode ' + it.kode + '. Untuk mengubah rak, tingkat, atau kolom, pakai "Pindahkan barang".',
      kolom: kol, nilai: nilai, tombol: 'Simpan perubahan',
      bagian: [{ judul: 'Identitas', kunci: utama }, { judul: 'Isian lainnya', kunci: lain, lipat: true }],
      onSimpan: function (vals, peng) {
        var ubah = {};
        kol.forEach(function (c) { if (vals[c.k] !== nilai[c.k]) { ubah[c.k] = vals[c.k]; } });
        if (!Object.keys(ubah).length) { throw new Error('Tidak ada yang diubah.'); }
        return kirimAksi('edit', peng, it.kode, ubah).then(function () {
          return segarkanDariServer(it.kode, 'Perubahan tersimpan.');
        });
      }
    });
  }

  function formPindah(it) {
    if (!butuhKolom()) { return; }
    var kol = kolomForm.filter(function (c) { return c.grup === 'posisi' || c.grup === 'dekat'; });
    var nilai = {};
    kol.forEach(function (c) { nilai[c.k] = nilaiKolom(it, c); });
    var rk = kol.filter(function (c) { return c.k === 'rak' || c.k === 'rak_id'; })[0];
    var kunciRakForm = rk ? rk.k : 'rak';
    bukaForm({
      judul: 'Pindahkan barang',
      catatan: 'Kode ' + it.kode + ' · ' + it.nama + (it.fotoLokasi ? '. Foto rak barang ini akan dibuang ke tempat sampah.' : ''),
      kolom: kol, nilai: nilai, tombol: 'Simpan posisi baru',
      bagian: [{ judul: 'Lokasi baru', kunci: kunciPosisi(kol) }],
      pratinjau: function (v) {
        var pilih = function (k, asal) { return v[k] === undefined ? asal : v[k]; };
        return [lokasiTeks(it.rak, it.tingkat, it.kolom), lokasiTeks(pilih(kunciRakForm, it.rak), pilih('tingkat', it.tingkat), pilih('kolom', it.kolom))];
      },
      onSimpan: function (vals, peng) {
        var ubah = {};
        kol.forEach(function (c) { if (vals[c.k] !== nilai[c.k]) { ubah[c.k] = vals[c.k]; } });
        var kunci = Object.keys(ubah);
        if (!kunci.length) { throw new Error('Tidak ada yang diubah.'); }
        var geser = kunci.some(function (k) { return KUNCI_POSISI[k]; });
        if (geser && it.fotoLokasi && !window.confirm('Foto rak lama barang ini akan dibuang ke tempat sampah. Lanjutkan?')) {
          var b = new Error('Dibatalkan.'); b.batal = true; throw b;
        }
        return kirimAksi('pindah', peng, it.kode, ubah).then(function (d) {
          var pesan = 'Barang dipindahkan.' + (d.fotoDibuang ? ' Foto rak lama sudah dibuang.' : '') + (d.geser ? ' Ambil foto rak yang baru.' : '');
          return segarkanDariServer(it.kode, pesan, d.geser ? function (baru) {
            return { label: 'Ambil foto rak baru', aksi: function () { pilihFoto(baru, 'lokasi'); } };
          } : null);
        });
      }
    });
  }

  function formTambah() {
    if (!butuhKolom()) { return; }
    var kol = kolomForm.slice();
    var kunciNama = kol.filter(function (c) { return c.wajib; })[0];
    var utama = kol.filter(function (c) { return c.wajib || c.k === 'kategori'; }).map(function (c) { return c.k; });
    var lokasi = kunciPosisi(kol.filter(function (c) { return c.grup === 'posisi'; }));
    var lain = kol.map(function (c) { return c.k; }).filter(function (k) { return utama.indexOf(k) === -1 && lokasi.indexOf(k) === -1; });
    bukaForm({
      judul: 'Tambah barang baru',
      catatan: 'Kode diberikan otomatis. Hanya nama yang wajib diisi. Foto bisa diunggah setelah barang tersimpan.',
      kolom: kol, nilai: {}, tombol: 'Simpan barang',
      bagian: [{ judul: 'Identitas', kunci: utama }, { judul: 'Lokasi', kunci: lokasi }, { judul: 'Isian lainnya', kunci: lain, lipat: true }],
      onSimpan: function (vals, peng) {
        var ubah = {};
        kol.forEach(function (c) { if (vals[c.k]) { ubah[c.k] = vals[c.k]; } });
        if (!kunciNama || !ubah[kunciNama.k]) { throw new Error('Nama barang wajib diisi.'); }
        var kembar = semua.some(function (x) { return x._n === norm(ubah[kunciNama.k]); });
        if (kembar && !window.confirm('Barang dengan nama yang sama sudah ada. Tetap tambahkan?')) {
          var b = new Error('Dibatalkan.'); b.batal = true; throw b;
        }
        return kirimAksi('tambah', peng, '', ubah).then(function (d) {
          return segarkanDariServer(d.kode, 'Barang ditambahkan dengan kode ' + d.kode +
            (d.fotoDibuang ? ' (sisa foto lama dengan kode ini dibuang)' : '') + '. Unggah fotonya lewat tombol di bawah kartu.');
        });
      }
    });
  }

  /* ---------- Memuat data ---------- */

  function bacaLokal() {
    try {
      var s = localStorage.getItem(KUNCI_LOKAL);
      if (!s) { return null; }
      var o = JSON.parse(s);
      return o && o.items && o.items.length ? o : null;
    } catch (e) { return null; }
  }
  function simpanLokal(items) {
    try { localStorage.setItem(KUNCI_LOKAL, JSON.stringify({ t: Date.now(), items: items, kolomForm: kolomForm })); } catch (e) { /* abaikan */ }
  }

  function ambilDariServer() {
    var url = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'k=' + encodeURIComponent(KODE_AKSES);
    var pengendali = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var batas = setTimeout(function () { if (pengendali) { pengendali.abort(); } }, 20000);
    return fetch(url, pengendali ? { signal: pengendali.signal } : undefined)
      .then(function (r) {
        clearTimeout(batas);
        if (!r.ok) {
          var eh = new Error('server membalas kode ' + r.status);
          eh.kode = 'HTTP';
          throw eh;
        }
        return r.json();
      })
      .then(function (d) {
        if (!d.ok) {
          var e = new Error(d.pesan || 'Terjadi kesalahan di server.');
          e.kode = d.error;
          throw e;
        }
        kolomForm = d.kolomForm || kolomForm;
        return d.items || [];
      });
  }

  function dataSiap() {
    bangunRakNav();
    pasangTombolAdmin();
    $('subjudul').textContent = semua.length + ' barang tercatat';
    if (awalSudahDiproses) {
      segarkanTampilan();
      if (!$('saran').hidden) { tampilSaran(); }
      return;
    }
    awalSudahDiproses = true;
    var param = new URLSearchParams(window.location.search);
    var q = param.get('q');
    var rak = param.get('rak');
    if (q) { $('q').value = q; tampilHasil(q); }
    else if (rak) { tampilRak(rak, false); }
  }

  function muat() {
    var param = new URLSearchParams(window.location.search);
    if (param.get('k')) { KODE_AKSES = param.get('k'); }

    if (!API_URL || API_URL.indexOf('GANTI_') === 0) {
      modeDemo = true;
      semua = siapkan(DATA_DEMO);
      dataSiap();
      pasangTombolAdmin();
      setStale('MODE DEMO: yang dicari hanya data contoh, BUKAN data spreadsheet Anda. Isi API_URL di file index.html dengan URL web app Apps Script.');
      return;
    }

    var lokal = bacaLokal();
    if (lokal) {
      semua = siapkan(lokal.items);
      kolomForm = lokal.kolomForm || [];
      dataSiap();
    } else {
      setInfo('Memuat data barang…');
    }
    setStale('');

    ambilDariServer().then(function (items) {
      semua = siapkan(items);
      simpanLokal(items);
      setStale('');
      if (!lokal && terakhir.jenis === 'beranda') { setInfo(''); }
      dataSiap();
      if (!items.length) { setInfo('Belum ada barang di spreadsheet.', 'peringatan'); }
    }).catch(function (err) {
      if (err && err.kode === 'KODE_SALAH') {
        setInfo(err.message, 'galat');
        return;
      }
      if (lokal) {
        setStale('Tidak bisa terhubung ke server. Yang tampil adalah data tersimpan terakhir, mungkin belum yang terbaru.', { label: 'Coba lagi', aksi: muat });
        if (terakhir.jenis === 'beranda') { setInfo(''); }
      } else {
        var sebab = (err && err.kode && err.message) ? err.message : 'tidak bisa terhubung ke server (periksa sinyal atau URL Apps Script)';
        setInfo('Gagal memuat data: ' + sebab + '. ', 'galat', { label: 'Coba lagi', aksi: muat });
      }
    });
  }

  /* ---------- Pasang kejadian ---------- */

  $('q').addEventListener('input', tampilSaran);
  $('q').addEventListener('input', perbaruiHapusQ);
  $('hapusQ').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('hapusQ').addEventListener('click', function () {
    $('q').value = '';
    tutupSaran();
    perbaruiHapusQ();
    $('q').focus();
  });
  $('q').addEventListener('focus', function () { if (norm($('q').value)) { tampilSaran(); } });
  $('q').addEventListener('keydown', function (e) {
    var buka = !$('saran').hidden;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!buka) { tampilSaran(); }
      aktifkanSaran(saranAktif + 1);
    } else if (e.key === 'ArrowUp') {
      if (buka) { e.preventDefault(); aktifkanSaran(saranAktif - 1); }
    } else if (e.key === 'Enter') {
      if (buka && saranAktif >= 0 && saranData[saranAktif]) { e.preventDefault(); pilihSaran(saranData[saranAktif]); }
    } else if (e.key === 'Escape') {
      if (buka) { tutupSaran(); }
    }
  });
  document.addEventListener('pointerdown', function (e) {
    if (!$('cariWrap').contains(e.target)) { tutupSaran(); }
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    tutupSaran();
    tampilHasil($('q').value);
    $('q').blur();
  });
  $('tutupFoto').addEventListener('click', tutupFoto);
  $('lightbox').addEventListener('click', function (e) { if (e.target === this) { tutupFoto(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { tutupFoto(); } });

  var tickerEl = $('ticker');
  tickerEl.addEventListener('touchstart', function () { tickerEl.classList.add('jeda'); }, { passive: true });
  ['touchend', 'touchcancel'].forEach(function (nm) {
    tickerEl.addEventListener(nm, function () { tickerEl.classList.remove('jeda'); }, { passive: true });
  });
  var tundaUkur = null;
  window.addEventListener('resize', function () {
    clearTimeout(tundaUkur);
    tundaUkur = setTimeout(pasangTicker, 250);
  });

  terapkanMerek();
  pasangTombolAdmin();
  muat();
  window.addEventListener('load', ukurTicker);
})();
</script>
</body>
</html>
