<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06395a">
<meta name="color-scheme" content="light">
<title>Cari Barang Gudang</title>
<style>
  :root {
    color-scheme: light;
    --laut-tua: #06395a;
    --laut: #0b6e99;
    --aqua: #19b5c8;
    --aqua-teks: #04293f;
    --bg: #f1f7fa;
    --kartu: #ffffff;
    --teks: #14232d;
    --redup: #53687a;
    --garis: #d6e4ec;
    --aksen: var(--laut);
    --aksen-teks: #ffffff;
    --aksen-lembut: #e3f3f8;
    --peringatan: #8a4b08;
    --peringatan-bg: #fff3dc;
    --galat: #9b1c1c;
    --galat-bg: #fde8e8;
    --radius: 14px;
    --tinggi-ticker: 38px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--teks);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Kepala halaman ---------- */
  .kepala {
    position: relative;
    background: linear-gradient(135deg, var(--laut-tua) 0%, var(--laut) 100%);
    color: #fff;
    padding-bottom: 34px;
  }
  .bar { display: flex; align-items: center; gap: 12px; padding: 14px 0 4px; }
  .logo {
    width: 68px; height: 68px; flex-shrink: 0;
    border-radius: 14px; background: #fff; color: var(--laut);
    display: flex; align-items: center; justify-content: center; padding: 5px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
  }
  .logo img, .logo svg { max-width: 100%; max-height: 100%; display: block; }
  .logo svg { width: 62%; height: 62%; }
  .merek b { display: block; font-size: .92rem; letter-spacing: .06em; line-height: 1.2; }
  .merek span { display: block; margin-top: 2px; font-size: .74rem; opacity: .85; letter-spacing: .16em; text-transform: uppercase; }
  .hero { padding: 16px 0 6px; }
  .hero h1 { margin: 0; font-size: 1.75rem; line-height: 1.12; letter-spacing: .01em; }
  .hero p { margin: 4px 0 14px; opacity: .92; font-size: .95rem; }
  #form { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px;
    padding: 14px 16px;
    border: 0; border-radius: 12px;
    background: #fff; color: var(--teks);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    -webkit-appearance: none; appearance: none;
  }
  input[type=search]::placeholder { color: #6b7f8d; }
  input[type=search]:focus { outline: 3px solid var(--aqua); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; }
  .btn-cari {
    padding: 0 24px; border: 0; border-radius: 12px;
    background: var(--aqua); color: var(--aqua-teks); font-weight: 700; letter-spacing: .02em;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
  }
  .btn-cari:active { filter: brightness(.92); }
  button:focus-visible, .foto.ada:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
  /* ---------- Daftar saran saat mengetik ---------- */
  .cari-wrap { position: relative; }
  .saran {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
    background: #fff; color: var(--teks); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(3, 20, 32, .38);
    max-height: min(46vh, 380px); overflow-y: auto;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .saran[hidden] { display: none; }
  .saran-ket, .saran-label {
    position: sticky; top: 0; z-index: 1;
    padding: 8px 14px; font-size: .78rem; color: var(--redup);
    background: #eef6f9; border-bottom: 1px solid var(--garis);
  }
  .saran-label { position: static; background: #fff8e6; color: var(--peringatan); border-top: 1px solid var(--garis); }
  .saran-kosong { padding: 14px; color: var(--redup); font-size: .92rem; }
  .saran-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 12px 14px; border-top: 1px solid var(--garis); cursor: pointer;
  }
  .saran-ket + .saran-item, .saran-label + .saran-item { border-top: 0; }
  .saran-item:hover, .saran-item.aktif { background: var(--aksen-lembut); }
  .saran-item .n { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .saran-item .n b { color: var(--laut); font-weight: 700; }
  .saran-item small { flex-shrink: 0; text-align: right; color: var(--redup); font-size: .78rem; }
  .jumlah { display: block; margin-top: 10px; font-size: .8rem; opacity: .85; min-height: 1.2em; }
  .ombak { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 30px; display: block; }
  .ombak .o1 { fill: rgba(25, 181, 200, .35); }
  .ombak .o2 { fill: var(--bg); }

  main.wrap { padding-top: 6px; padding-bottom: calc(var(--tinggi-nyata, calc(var(--tinggi-ticker) + env(safe-area-inset-bottom, 0px))) + 72px); }

  /* ---------- Info / pesan ---------- */
  .info { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--aksen-lembut); font-size: .92rem; }
  .info.peringatan { background: var(--peringatan-bg); color: var(--peringatan); }
  .info.galat { background: var(--galat-bg); color: var(--galat); }
  .info button { margin-left: 8px; padding: 4px 10px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; }
  .info:empty { display: none; }
  .judul-hasil { margin: 4px 0 10px; font-size: .92rem; color: var(--redup); }

  /* ---------- Kartu barang ---------- */
  .kartu {
    background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(6, 57, 90, .06);
  }
  .kartu .atas { display: grid; grid-template-columns: 1fr; }
  .kartu .isi { padding: 14px; }
  .kartu h3 { margin: 0; font-size: 1.15rem; line-height: 1.25; color: var(--laut-tua); }
  .kartu .meta { margin: 2px 0 0; color: var(--redup); font-size: .88rem; }

  .lokasi { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .chip {
    flex: 1 1 0; min-width: 84px;
    background: var(--aksen-lembut); border-radius: 12px; padding: 8px 10px; text-align: center;
    border-bottom: 3px solid var(--aqua);
  }
  .chip small { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .chip b { display: block; font-size: 1.6rem; line-height: 1.15; color: var(--laut); word-break: break-word; }
  .dekat { margin: 8px 0 0; font-size: 1rem; }
  .dekat svg { vertical-align: -3px; margin-right: 4px; color: var(--laut); }
  .rak-info { margin: 2px 0 0; color: var(--redup); font-size: .88rem; }
  .tambahan { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .tambahan span { background: var(--bg); border: 1px solid var(--garis); border-radius: 999px; padding: 2px 10px; font-size: .82rem; color: var(--redup); }
  .tambahan b { color: var(--teks); font-weight: 600; }

  .stok { margin: 8px 0 0; font-weight: 600; color: var(--laut-tua); }
  .stok.menipis { color: var(--peringatan); }
  .stok.habis { color: var(--galat); }

  .foto-baris { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--garis); }
  .foto-blok { padding: 12px 14px; }
  .foto-blok + .foto-blok { border-top: 1px solid var(--garis); }
  .foto-blok h4 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .foto {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    border-radius: 10px; overflow: hidden; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  }
  .foto.ada { cursor: zoom-in; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto.kosong { border: 1.5px dashed var(--garis); color: var(--redup); font-size: .85rem; }
  .foto.kosong svg { opacity: .7; }

  .aksi { padding: 0 14px 14px; }
  .btn-rak {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid var(--laut); background: transparent; color: var(--laut); font-weight: 600;
  }
  .btn-rak:active { background: var(--aksen-lembut); }
  .btn-rak:disabled { opacity: .55; cursor: wait; }

  .admin-aksi { display: flex; gap: 8px; padding: 0 14px 14px; flex-wrap: wrap; }
  .admin-aksi .btn-rak { flex: 1 1 140px; width: auto; background: var(--aksen-lembut); }
  .peringatan-data { margin: 0 14px 10px; padding: 10px 12px; border-radius: 10px; background: var(--peringatan-bg); color: var(--peringatan); font-size: .88rem; }
  .peringatan-data b { display: block; margin-bottom: 2px; }
  .peringatan-data ul { margin: 0; padding-left: 18px; }
  .masalah-ket { margin: 4px 0 0; font-size: .82rem; color: var(--peringatan); text-align: left; }
  /* ---------- Kotak pencarian + tombol hapus (x) ---------- */
  .kotak-input { position: relative; flex: 1; min-width: 0; display: flex; }
  .kotak-input input[type=search] { flex: 1; padding-right: 54px; }
  input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .hapus-q { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; padding: 0; border: 0; border-radius: 999px; background: var(--aksen-lembut); color: var(--laut); font-size: 1.6rem; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .hapus-q[hidden] { display: none; }

  /* ---------- Formulir (lembar dari bawah di HP, kotak di tengah di layar lebar) ---------- */
  .modal { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(3, 20, 32, .6); align-items: flex-end; justify-content: center; }
  .modal.buka { display: flex; }
  #pilihRak { z-index: 50; }
  .form-kotak, .rak-sheet { width: 100%; max-width: 560px; display: flex; flex-direction: column; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 32px rgba(3, 20, 32, .4); overflow: hidden; }
  .form-kotak { max-height: 94vh; max-height: 94dvh; }
  .rak-sheet { height: min(88vh, 640px); }
  @media (min-width: 600px) { .modal { align-items: center; } .form-kotak, .rak-sheet { border-radius: var(--radius); } }
  .sheet-kepala { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
  .sheet-kepala h3 { margin: 0; font-size: 1.2rem; color: var(--laut-tua); }
  .sheet-x { width: 44px; height: 44px; flex-shrink: 0; padding: 0; border: 0; border-radius: 999px; background: var(--aksen-lembut); color: var(--laut); font-size: 1.6rem; line-height: 1; }
  .form-isi { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .form-isi .meta { margin: 0 0 8px; }
  .bagian { margin-top: 14px; }
  .bagian h4, .lipat summary { margin: 0 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .lipat { margin-top: 14px; border-top: 1px solid var(--garis); padding-top: 6px; }
  .lipat summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
  .field { margin: 10px 0 0; }
  .field label { display: block; margin: 0 0 4px; font-size: .85rem; font-weight: 600; color: var(--redup); }
  .field input[type=text] { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; background: #fff; color: var(--teks); }
  .field input[type=text]:focus, .rak-baru input:focus, .rak-sheet > input:focus { outline: 3px solid var(--aqua); outline-offset: 1px; }
  .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rak-tombol { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1.5px solid var(--laut); border-radius: 10px; background: var(--aksen-lembut); color: var(--laut-tua); font-weight: 700; text-align: left; }
  .pratinjau { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--aksen-lembut); font-size: .9rem; line-height: 1.5; }
  .pratinjau b { color: var(--laut-tua); }
  .form-kaki { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--garis); background: #fff; }
  .form-galat { color: var(--galat); font-size: .9rem; margin-bottom: 8px; }
  .form-galat:empty { display: none; }
  .form-tombol { display: flex; flex-wrap: wrap; gap: 8px; }
  .form-tombol button.lagi, .form-tombol button.lagi[type=submit] { flex: 1 1 100%; order: 3; background: var(--aksen-lembut); color: var(--laut-tua); }
  .form-tombol button { flex: 1; min-height: 48px; border-radius: 10px; font-weight: 700; border: 1.5px solid var(--laut); background: transparent; color: var(--laut); }
  .form-tombol button[type=submit] { flex: 2; background: var(--laut); color: #fff; }
  .form-tombol button:disabled { opacity: .6; cursor: wait; }
  .rak-sheet > input[type=search] { margin: 0 16px 8px; width: calc(100% - 32px); flex: none; min-height: 48px; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; box-shadow: none; }
  .rak-pilih { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; align-content: flex-start; }
  .rak-opsi { flex: 1 1 140px; min-height: 56px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--garis); background: var(--bg); color: var(--teks); text-align: left; line-height: 1.2; }
  .rak-opsi b { display: block; font-size: 1.05rem; color: var(--laut); }
  .rak-opsi small { color: var(--redup); }
  .rak-opsi.dipakai { border-color: var(--laut); background: var(--aksen-lembut); }
  .sheet-label { margin: 6px 16px 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--redup); }
  .rak-baru { display: flex; gap: 8px; padding: 0 16px; }
  .rak-baru input { flex: 1; min-width: 0; min-height: 48px; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; }
  .rak-baru button { padding: 0 20px; border-radius: 10px; border: 0; background: var(--laut); color: #fff; font-weight: 700; }
  .rak-kosong { margin: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); min-height: 48px; border-radius: 10px; border: 1.5px dashed var(--garis); background: transparent; color: var(--redup); }
  #wizFoto { z-index: 60; }
  .btn-gembok { margin-left: auto; width: 44px; height: 44px; flex-shrink: 0; padding: 0; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff; display: flex; align-items: center; justify-content: center; }
  .btn-gembok[hidden] { display: none; }
  .btn-gembok.aktif { background: var(--aqua); color: var(--aqua-teks); }
  .versi { margin: 4px 0 0; text-align: center; font-size: .72rem; color: var(--redup); opacity: .8; }
  .sukses { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: #e3f6ec; color: #17653a; font-size: .9rem; font-weight: 600; }
  .petunjuk { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; font-size: .85rem; line-height: 1.35; color: var(--redup); background: var(--bg); }
  .petunjuk:empty { display: none; }
  .petunjuk.sama { background: var(--peringatan-bg); color: var(--peringatan); font-weight: 600; }
  .centang { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 14px; font-weight: 600; color: var(--laut-tua); }
  .centang input { width: 22px; height: 22px; flex-shrink: 0; }
  .wiz-pratinjau { width: 100%; aspect-ratio: 4 / 3; border: 1.5px dashed var(--garis); border-radius: 12px; background: var(--bg); color: var(--redup); display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; padding: 8px; }
  .wiz-pratinjau img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 8px; }
  .wiz-aksi { display: flex; gap: 8px; margin-top: 10px; }
  .wiz-aksi button { flex: 1; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--laut); background: var(--aksen-lembut); color: var(--laut-tua); font-weight: 700; }
  .field select { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--garis); border-radius: 10px; background: #fff; color: var(--teks); }
  .op-progres { margin: 10px 0; }
  .op-bar { height: 14px; border-radius: 999px; background: var(--garis); overflow: hidden; }
  .op-isi { height: 100%; background: var(--aqua); border-radius: 999px; }
  .op-label { margin-top: 4px; font-size: .85rem; color: var(--redup); }
  .op-sinkron { margin: 8px 0; padding: 8px 12px; border-radius: 10px; background: #e3f6ec; color: #17653a; font-size: .85rem; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .op-sinkron.tunggu { background: var(--peringatan-bg); color: var(--peringatan); }
  .op-sinkron button { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; font-weight: 600; }
  .op-cari input { width: 100%; min-height: 48px; font: inherit; font-size: 16px; padding: 10px 14px; border: 1.5px solid var(--garis); border-radius: 12px; background: #fff; color: var(--teks); box-shadow: none; }
  .op-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .op-menu button { min-height: 48px; padding: 8px; border-radius: 10px; border: 1.5px solid var(--laut); background: var(--aksen-lembut); color: var(--laut-tua); font-weight: 700; }
  .op-menu button:disabled { opacity: .5; cursor: not-allowed; }
  .op-sub-judul { margin: 16px 0 6px; font-size: .9rem; color: var(--laut-tua); }
  .op-baris .op-sub { display: block; font-weight: 400; color: var(--redup); font-size: .8rem; }
  .op-baris.sesuai .ket { color: #17653a; font-weight: 700; }
  .op-baris.selisih .ket { color: var(--galat); font-weight: 700; }
  .op-baris.ulang .ket { color: var(--peringatan); font-weight: 700; }
  .op-jumlah { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
  .op-jumlah input { flex: 1; min-width: 0; text-align: center; font: inherit; font-size: 1.6rem; font-weight: 700; min-height: 58px; border: 1.5px solid var(--laut); border-radius: 10px; }
  .op-jumlah button { width: 58px; font-size: 1.8rem; border-radius: 10px; border: 1.5px solid var(--laut); background: var(--aksen-lembut); color: var(--laut-tua); padding: 0; }
  .op-cepat { display: flex; gap: 8px; margin-top: 10px; }
  .op-cepat button { flex: 1; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--garis); background: var(--bg); color: var(--teks); font-weight: 600; }
  .op-selisih { margin-top: 8px; font-size: .9rem; font-weight: 600; min-height: 1.3em; }
  .op-selisih.besar { color: var(--peringatan); }
  .op-baris-tugas { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--garis); flex-wrap: wrap; }
  .op-baris-tugas select { flex: 1 1 160px; min-height: 44px; font: inherit; font-size: 16px; border: 1.5px solid var(--garis); border-radius: 10px; padding: 0 8px; background: #fff; }
  .chip-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip-filter button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--garis); background: var(--kartu); color: var(--teks); font-weight: 600; }
  .chip-filter button.aktif { border-color: var(--laut); background: var(--aksen-lembut); color: var(--laut-tua); }
  .admin-bar .tambah { display: inline-block; margin-right: 14px; color: var(--laut); font-weight: 600; }
  .admin-bar { margin: 16px 0 0; text-align: center; }
  .admin-bar .periksa { display: inline-block; margin-right: 14px; color: var(--peringatan); font-weight: 600; }
  .admin-bar button { border: 0; background: transparent; color: var(--redup); font-size: .8rem; text-decoration: underline; }

  @media (min-width: 600px) {
    .foto-baris { grid-template-columns: 1fr 1fr; }
    .foto-blok + .foto-blok { border-top: 0; border-left: 1px solid var(--garis); }
    .hero h1 { font-size: 2.1rem; }
  }

  /* ---------- Tampilan isi rak ---------- */
  .rak-judul { margin: 0 0 4px; font-size: 1.3rem; color: var(--laut-tua); }
  .btn-kembali { border: 0; background: transparent; color: var(--laut); padding: 4px 0; margin-bottom: 8px; font-weight: 600; }
  .tingkat { background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--radius); margin: 12px 0; overflow: hidden; }
  .tingkat > h4 { margin: 0; padding: 10px 14px; background: var(--aksen-lembut); font-size: .95rem; color: var(--laut-tua); }

  /* ---------- Alat bantu ---------- */

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined) { return; }   // nilai kosong = atribut tidak dipasang
        if (k === 'class') { e.className = v; }
        else if (k === 'text') { e.textContent = v; }
        else if (k.slice(0, 2) === 'on') { e.addEventListener(k.slice(2), v); }
        else { e.setAttribute(k, v); }
      });
    }
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) { return; }
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function norm(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function bersihAwalan(nilai, kata) {
    return String(nilai || '').replace(new RegExp('^' + kata + '[\\s.:-]*', 'i'), '').trim() || String(nilai || '');
  }

  var hitungKode = {};

  function siapkan(items) {

    var hasil = (items || []).map(function (it, idx) {
      it._id = idx;
      it._h = norm([it.nama, it.kode, it.kategori, it.kataKunci].join(' '));
      it._i = norm(Object.keys(it.info || {}).map(function (k) { return it.info[k]; }).join(' '));
      it._hr = (it._h + it._i).replace(/ /g, '');
      it._hn = it._h.replace(/ /g, '');
      it._n = norm(it.nama);
      it._r = norm(bersihAwalan(it.rak, 'rak'));
      var kk = kunciKode(it.kode);
      if (kk) { hitungKode[kk] = (hitungKode[kk] || 0) + 1; }
      return it;
    });
    return hasil;
  }

  // Daftar masalah data pada satu barang (hanya relevan untuk admin)

  /* ---------- Foto ---------- */

  /* ---------- Pencarian ---------- */

  function cari(q) {
    var kata = norm(q).split(' ').filter(Boolean);
    if (!kata.length) { return []; }
    var utuh = kata.join(' ');
    var rapat = utuh.replace(/ /g, '');
    var hasil = [];
    semua.forEach(function (it) {
      var gabung = it._h + ' ' + it._i;
      var cocokKata = true;
      for (var i = 0; i < kata.length; i++) {
        if (gabung.indexOf(kata[i]) === -1) { cocokKata = false; break; }
      }
      var cocokRapat = rapat.length >= 3 && it._hr.indexOf(rapat) !== -1;
      if (!cocokKata && !cocokRapat) { return; }

      var skor = 4;
      var semuaDiNama = true;
      for (var j = 0; j < kata.length; j++) {
        if (it._h.indexOf(kata[j]) === -1) { semuaDiNama = false; break; }
      }
      var diNama = semuaDiNama || (rapat.length >= 3 && it._hn.indexOf(rapat) !== -1);
      if (diNama) { skor = 3; }
      if (it._n === utuh) { skor = 0; }
      else if (it._n.indexOf(utuh) === 0) { skor = 1; }
      else if (diNama && (' ' + it._n).indexOf(' ' + kata[0]) !== -1) { skor = 2; }
      hasil.push({ it: it, skor: skor });
    });
    hasil.sort(function (a, b) {
      return a.skor - b.skor || a.it.nama.localeCompare(b.it.nama, 'id', { numeric: true });

  /* ---------- Toleransi salah ketik ---------- */

  function lev(a, b) {
    var al = a.length, bl = b.length, i, j;
    if (!al) { return bl; }
    if (!bl) { return al; }
    var d = [];
    for (i = 0; i <= al; i++) { d[i] = [i]; }
    for (j = 0; j <= bl; j++) { d[0][j] = j; }
    for (i = 1; i <= al; i++) {
      for (j = 1; j <= bl; j++) {
        var c = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
        if (i > 1 && j > 1 && a.charAt(i - 1) === b.charAt(j - 2) && a.charAt(i - 2) === b.charAt(j - 1)) {
          d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
        }
      }
    }
    return d[al][bl];
  }

  function cariKira(q, sudah) {
    var kata = norm(q).split(' ').filter(Boolean);
    var adaPanjang = kata.some(function (k) { return k.length >= 4; });
    if (!kata.length || !adaPanjang) { return []; }
    var lewat = {};
    (sudah || []).forEach(function (it) { lewat[it._id] = true; });
    var hasil = [];
    semua.forEach(function (it) {
      if (lewat[it._id]) { return; }
      var gabung = it._h + ' ' + it._i;
      var kataItem = gabung.split(' ').filter(Boolean);
      var jarak = 0;
      for (var i = 0; i < kata.length; i++) {
        var k = kata[i];
        if (k.length < 4) {
          if (gabung.indexOf(k) === -1) { return; }
          continue;
        }
        var tol = k.length >= 7 ? 2 : 1;
        var terbaik = 99;
        for (var j = 0; j < kataItem.length; j++) {
          var w = kataItem[j];
          var dd = lev(k, w);
          if (w.length > k.length) { dd = Math.min(dd, lev(k, w.slice(0, k.length))); }
          if (dd < terbaik) { terbaik = dd; }
        }
        if (terbaik > tol) { return; }
        jarak += terbaik;
      }
      hasil.push({ it: it, jarak: jarak });
    });
    hasil.sort(function (a, b) { return a.jarak - b.jarak || a.it.nama.localeCompare(b.it.nama, 'id', { numeric: true }); });

  }

  function aktifkanSaran(i) {
    var item = $('saran').querySelectorAll('.saran-item');
    if (!item.length) { return; }
    saranAktif = Math.max(-1, Math.min(item.length - 1, i));
    Array.prototype.forEach.call(item, function (e, n) {
      e.classList.toggle('aktif', n === saranAktif);
      e.setAttribute('aria-selected', n === saranAktif ? 'true' : 'false');
    });
    if (saranAktif >= 0) {
      item[saranAktif].scrollIntoView({ block: 'nearest' });
      $('q').setAttribute('aria-activedescendant', 'saran-' + saranAktif);
    } else {
      $('q').removeAttribute('aria-activedescendant');
    }
  }

  function tampilSaran() {
    var q = $('q').value;
    var panel = $('saran');
    if (!norm(q)) { tutupSaran(); return; }

    panel.innerHTML = '';
    panel.hidden = false;
    $('q').setAttribute('aria-expanded', 'true');
    saranData = [];
    saranAktif = -1;

    if (!semua.length) {
      panel.appendChild(el('div', { class: 'saran-kosong', text: 'Data barang masih dimuat…' }));
      return;
    }

    var langsung = cari(q);
    var kira = langsung.length < 8 ? cariKira(q, langsung) : [];
    var total = langsung.length + kira.length;

    if (!total) {
      panel.appendChild(el('div', { class: 'saran-kosong', text: 'Tidak ada barang yang cocok. Coba kata yang lebih pendek.' }));
      return;
    }

    var tampilLangsung = langsung.slice(0, BATAS_SARAN);
    var tampilKira = kira.slice(0, Math.max(0, BATAS_SARAN - tampilLangsung.length));
    var ket = langsung.length
      ? langsung.length + ' barang cocok' + (langsung.length > BATAS_SARAN ? ' (menampilkan ' + BATAS_SARAN + ' pertama, ketik lebih banyak huruf untuk mempersempit)' : ', gulir untuk melihat semuanya')
      : '';
    if (ket) { panel.appendChild(el('div', { class: 'saran-ket', text: ket })); }

    function baris(it) {
      var n = saranData.length;
      saranData.push(it);
      var lok = lokasiRingkas(it);
      var row = el('div', { class: 'saran-item', role: 'option', id: 'saran-' + n, 'aria-selected': 'false' }, [
        el('span', { class: 'n' }, [sorot(it.nama, q)]),
        lok ? el('small', { text: lok }) : null
      ]);
      row.addEventListener('click', function () { pilihSaran(it); });
      row.addEventListener('mouseenter', function () { aktifkanSaran(n); });
      panel.appendChild(row);
    }
    tampilLangsung.forEach(baris);
    if (tampilKira.length) {
      panel.appendChild(el('div', { class: 'saran-label', text: 'Mungkin maksud Anda:' }));
      tampilKira.forEach(baris);
    }
    panel.scrollTop = 0;
  }

  function pilihSaran(it) {
    $('q').value = it.nama;
    tutupSaran();
    $('q').blur();
    tampilSatu(it);
  }

  /* ---------- Tampilan: satu barang pilihan ---------- */

  function kunciItem(it) { return [it.nama, it.kode, it.rak, it.tingkat, it.kolom].join('|'); }

  function tampilSatu(it) {
    terakhir = { jenis: 'satu', kunci: kunciItem(it) };
    perbaruiHapusQ();
    var box = $('hasil');
    box.innerHTML = '';
    $('rakNav').open = false;
    box.appendChild(el('p', { class: 'judul-hasil', text: 'Barang pilihan Anda' }));
    box.appendChild(kartuBarang(it));
    var mirip = cari(it.nama).length;
    if (mirip > 1) {
      box.appendChild(el('button', {
        type: 'button', class: 'btn-rak',
        text: 'Lihat ' + mirip + ' barang dengan nama mirip',
        onclick: function () { tampilHasil(it.nama); }
      }));
    }
    window.scrollTo(0, 0);
  }

  /* ---------- Stok ---------- */

  function stokEl(it) {
    if (!it.stok) { return null; }
    var n = parseFloat(String(it.stok).replace(',', '.'));
    var min = parseFloat(String(it.stokMin || '').replace(',', '.'));
    var kelas = 'stok';
    var label = 'Stok: ' + it.stok + (it.satuan ? ' ' + it.satuan : '');
    if (!isNaN(n) && n <= 0) { kelas += ' habis'; label += ' (habis)'; }
    else if (!isNaN(n) && !isNaN(min) && n <= min) { kelas += ' menipis'; label += ' (menipis)'; }
    return el('p', { class: kelas, text: label });
  }

  /* ---------- Tampilan: hasil pencarian ---------- */

  function chip(label, nilai) {
    return el('div', { class: 'chip' }, [el('small', { text: label }), el('b', { text: nilai })]);
  }

  function kartuBarang(it) {
    var chips = [];
    if (it.rak) { chips.push(chip('Rak', bersihAwalan(it.rak, 'rak'))); }
    if (it.tingkat) { chips.push(chip('Tingkat', bersihAwalan(it.tingkat, 'tingkat'))); }
    if (it.kolom) { chips.push(chip('Kolom', bersihAwalan(it.kolom, 'kolom'))); }

    var meta = [it.kategori, it.kode].filter(Boolean).join(' · ');
    var ket = [it.rakNama, it.rakLokasi].filter(Boolean).join(' — ');

    var tambahan = null;
    var kunciInfo = it.info ? Object.keys(it.info) : [];
    if (kunciInfo.length) {
      tambahan = el('div', { class: 'tambahan' }, kunciInfo.map(function (k) {
        return el('span', {}, [k.charAt(0).toUpperCase() + k.slice(1) + ': ', el('b', { text: it.info[k] })]);
      }));
    }

    var isi = el('div', { class: 'isi' }, [
      el('h3', { text: it.nama }),
      meta ? el('p', { class: 'meta', text: meta }) : null,
      chips.length ? el('div', { class: 'lokasi' }, chips) : el('p', { class: 'meta', text: 'Lokasi belum diisi.' }),
      stokEl(it),
      it.dekat ? el('p', { class: 'dekat' }, [ikonPin(), 'Dekat ' + it.dekat]) : null,
      ket ? el('p', { class: 'rak-info', text: ket }) : null,
      tambahan
    ]);

    var fotoBaris = el('div', { class: 'foto-baris' }, [
      el('div', { class: 'foto-blok' }, [el('h4', { text: 'Foto barang' }), fotoEl(it.fotoBarang, 'Foto barang')]),
      el('div', { class: 'foto-blok' }, [
        el('h4', { text: 'Foto rak (posisi barang ini)' }),
        fotoEl(it.fotoRak, 'Foto rak')
      ])
    ]);

    var aksi = it.rak ? el('div', { class: 'aksi' }, [
      el('button', {
        type: 'button', class: 'btn-rak',
        text: 'Lihat semua barang di rak ' + bersihAwalan(it.rak, 'rak'),
        onclick: function () { tampilRak(it.rak, true); }
      })
    ]) : null;

    var adminAksi = null;
    var peringatan = null;
    if (modeAdmin()) {
      var tombol = [];
      if (it.kode) {
        tombol.push(el('button', { type: 'button', class: 'btn-rak',
          text: (it.fotoBarang ? 'Ganti' : 'Tambah') + ' foto barang',
          onclick: function () { pilihFoto(it, 'barang'); } }));
      } else {
        tombol.push(el('span', { class: 'meta', text: 'Isi kolom KODE di sheet agar bisa upload foto barang.' }));
      }
      if (it.kode) {
        tombol.push(el('button', { type: 'button', class: 'btn-rak',
          text: (it.fotoLokasi ? 'Ganti' : 'Tambah') + ' foto rak barang ini',
          onclick: function () { pilihFoto(it, 'lokasi'); } }));
        tombol.push(el('button', { type: 'button', class: 'btn-rak', text: 'Edit info barang', onclick: function () { formEdit(it); } }));
        tombol.push(el('button', { type: 'button', class: 'btn-rak', text: 'Pindahkan barang', onclick: function () { formPindah(it); } }));
      }
      adminAksi = el('div', { class: 'admin-aksi' }, tombol);
      var mm = masalahItem(it);
      if (mm.length) {
        peringatan = el('div', { class: 'peringatan-data', role: 'alert' }, [
          el('b', { text: 'Perlu diperiksa' }),
          el('ul', {}, mm.map(function (x) { return el('li', { text: x.teks }); }))
        ]);
      }
    }

    return el('article', { class: 'kartu' }, [isi, fotoBaris, aksi, peringatan, adminAksi]);
  }

  function tampilHasil(q, semuaHasil) {
    terakhir = { jenis: 'cari', q: q, semua: !!semuaHasil };
    perbaruiHapusQ();
    var box = $('hasil');
    box.innerHTML = '';
    $('rakNav').open = false;

    if (!norm(q)) {
      setInfo('Ketik nama barang dulu, lalu klik Cari.');
      $('rakNav').open = true;
      return;
    }

    var hasil = cari(q);
    if (!hasil.length) {
      var kira = cariKira(q, []);
      if (kira.length) {
        setInfo('Tidak ada yang persis sama. Mungkin yang Anda cari:', 'peringatan');
        kira.slice(0, 10).forEach(function (it) { box.appendChild(kartuBarang(it)); });
        window.scrollTo(0, 0);
        return;
      }
      setInfo('Barang "' + q.trim() + '" tidak ditemukan. Coba kata yang lebih pendek, atau telusuri per rak di bawah.', 'peringatan');
      $('rakNav').open = true;
      return;
    }

    setInfo('');
    var tampil = semuaHasil ? hasil : hasil.slice(0, BATAS_HASIL);
    box.appendChild(el('p', { class: 'judul-hasil', text: hasil.length + ' barang ditemukan' }));
    tampil.forEach(function (it) { box.appendChild(kartuBarang(it)); });
    if (hasil.length > tampil.length) {
      box.appendChild(el('button', {
        type: 'button', class: 'btn-rak',
        text: 'Tampilkan semua ' + hasil.length + ' hasil',
        onclick: function () { tampilHasil(q, true); }
      }));
    }
    window.scrollTo(0, 0);
  }

  /* ---------- Tampilan: isi satu rak ---------- */

  function tampilRak(rakId, dariHasil) {
    terakhir = { jenis: 'rak', rak: rakId };
    perbaruiHapusQ();
    var kunci = norm(bersihAwalan(rakId, 'rak'));
    var isi = semua.filter(function (it) { return it._r === kunci; });
    var box = $('hasil');
    box.innerHTML = '';
    $('rakNav').open = false;
    setInfo('');

    if (!isi.length) {
      setInfo('Rak "' + rakId + '" tidak ditemukan atau belum ada isinya.', 'peringatan');
      $('rakNav').open = true;
      return;
    }

    var nama = bersihAwalan(rakId, 'rak');
    var kembali = el('button', {
      type: 'button', class: 'btn-kembali',
      text: dariHasil && $('q').value.trim() ? '← Kembali ke hasil pencarian' : '← Kembali',
      onclick: function () {
        if ($('q').value.trim()) { tampilHasil($('q').value); } else { beranda(); }
      }
    });
    box.appendChild(kembali);
    box.appendChild(el('h2', { class: 'rak-judul', text: 'Rak ' + nama }));
    var ket = [isi[0].rakNama, isi[0].rakLokasi].filter(Boolean).join(' — ');
    box.appendChild(el('p', { class: 'meta', text: (ket ? ket + ' · ' : '') + isi.length + ' barang' }));

    var kelompok = {};
    var urutan = [];
    isi.forEach(function (it) {
      var t = bersihAwalan(it.tingkat || '', 'tingkat') || '-';
      if (!kelompok[t]) { kelompok[t] = []; urutan.push(t); }
      kelompok[t].push(it);
    });
    urutan.sort(function (a, b) { return a.localeCompare(b, 'id', { numeric: true }); });

    urutan.forEach(function (t) {
      var daftar = kelompok[t].slice().sort(function (a, b) {
        return String(a.kolom).localeCompare(String(b.kolom), 'id', { numeric: true }) || a.nama.localeCompare(b.nama, 'id');
      });
      var fotoTingkat = '';
      daftar.forEach(function (it) { if (!fotoTingkat && it.fotoTingkat) { fotoTingkat = it.fotoTingkat; } });

      var blok = el('section', { class: 'tingkat' }, [
        el('h4', { text: t === '-' ? 'Tingkat belum diisi' : 'Tingkat ' + t + ' · ' + daftar.length + ' barang' })
      ]);
      if (fotoTingkat) { blok.appendChild(fotoEl(fotoTingkat, 'Foto rak')); }
      daftar.forEach(function (it) {
        var ketBaris = [it.kolom ? 'kolom ' + bersihAwalan(it.kolom, 'kolom') : '', it.dekat ? 'dekat ' + it.dekat : '']
          .filter(Boolean).join(' · ');
        blok.appendChild(el('button', {
          type: 'button', class: 'baris',
          onclick: function () { $('q').value = it.nama; tutupSaran(); tampilSatu(it); }
        }, [
          el('span', { class: 'nama', text: it.nama }),
          el('span', { class: 'ket', text: ketBaris })
        ]));
      });
      box.appendChild(blok);
    });
    window.scrollTo(0, 0);
  }

  /* ---------- Telusuri per rak ---------- */

  function bangunRakNav() {
    var nav = $('rakNav');
    var buka = nav.open;
    nav.innerHTML = '';
    var hitung = {};
    var urut = [];
    semua.forEach(function (it) {
      if (!it.rak) { return; }
      var k = bersihAwalan(it.rak, 'rak');
      if (!hitung[k]) { hitung[k] = { n: 0, nama: it.rakNama || '' }; urut.push(k); }
      hitung[k].n++;
      if (!hitung[k].nama && it.rakNama) { hitung[k].nama = it.rakNama; }
    });
    urut.sort(function (a, b) { return a.localeCompare(b, 'id', { numeric: true }); });

    nav.appendChild(el('summary', { text: 'Telusuri per rak (' + urut.length + ' rak, ' + semua.length + ' barang)' }));
    var daftar = el('div', { class: 'rak-daftar' });
    urut.forEach(function (k) {
      daftar.appendChild(el('button', { type: 'button', onclick: function () { tampilRak(k, false); } }, [
        el('b', { text: 'Rak ' + k }),
        el('small', { text: (hitung[k].nama ? hitung[k].nama + ' · ' : '') + hitung[k].n + ' barang' })
      ]));
    });
    nav.appendChild(daftar);
    nav.style.display = urut.length ? '' : 'none';
    nav.open = buka;
  }

  function beranda() {
    terakhir = { jenis: 'beranda' };
    perbaruiHapusQ();
    $('hasil').innerHTML = '';
    $('rakNav').open = true;
    setInfo('');
    window.scrollTo(0, 0);
  }

  /* ---------- Merek: judul, logo, teks berjalan ---------- */

  function pasangLogo() {
    var kotak = $('logo');
    kotak.innerHTML = '';
    function tetes() {
      kotak.innerHTML = '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.5-7-12.5z" fill="currentColor"/><path d="M9 15a3 3 0 0 0 3 3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
    }
    if (!LOGO_FILE) { tetes(); return; }
    var img = el('img', { src: LOGO_FILE, alt: '' });
    img.addEventListener('error', tetes);
    kotak.appendChild(img);
  }

  function pasangTicker() {
    var box = $('ticker');
    box.innerHTML = '';
    if (!TEKS_BERJALAN) { box.style.display = 'none'; ukurTicker(); return; }
    box.style.display = '';
    box.appendChild(el('span', { class: 'sr', text: TEKS_BERJALAN }));
    var track = el('div', { class: 'track', 'aria-hidden': 'true' });
    var grup = el('div', { class: 'grup' });
    track.appendChild(grup);
    box.appendChild(track);
    var unit = TEKS_BERJALAN + '   ◆   ';
    var lebar = Math.max(window.innerWidth, 320);
    grup.appendChild(el('span', { class: 'unit', text: unit }));
    var n = 0;
    while (grup.scrollWidth < lebar && n < 30) {
      grup.appendChild(el('span', { class: 'unit', text: unit }));
      n++;
    }
    track.appendChild(grup.cloneNode(true));
    track.style.setProperty('--durasi', Math.max(15, Math.round(grup.scrollWidth / 45)) + 's');
    ukurTicker();
  }

  // Tinggi teks berjalan diukur sungguhan, supaya isi halaman paling bawah tidak pernah tertutup
  function ukurTicker() {
    var t = $('ticker');
    var tinggi = t && t.style.display !== 'none' ? t.offsetHeight : 0;
    document.documentElement.style.setProperty('--tinggi-nyata', tinggi + 'px');
  }

  function terapkanMerek() {
    $('perusahaan').textContent = NAMA_PERUSAHAAN;
    $('bagian').textContent = NAMA_BAGIAN;
    $('judul').textContent = JUDUL;
    $('tagline').textContent = TAGLINE;
    document.title = JUDUL + ' | ' + NAMA_PERUSAHAAN;
    $('versi').textContent = 'Versi ' + VERSI;
    pasangLogo();
    pasangTicker();
  }

  /* ---------- Mode admin & upload foto ---------- */

  function kirimKeServer(obj) {
    // Tanpa header khusus (text/plain) supaya tidak kena preflight CORS di Apps Script
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(obj) }).then(function (r) { return r.json(); });
  }

  function tampilMasalah() {
    terakhir = { jenis: 'masalah' };
    var box = $('hasil');
    box.innerHTML = '';
    $('rakNav').open = false;
    setInfo('');
    box.appendChild(el('button', { type: 'button', class: 'btn-kembali', text: '← Kembali', onclick: beranda }));
    box.appendChild(el('h2', { class: 'rak-judul', text: 'Periksa data' }));
    var daftar = semuaMasalah();
    if (!daftar.length) {
      box.appendChild(el('p', { class: 'info', text: 'Tidak ada masalah ditemukan. Semua barang punya kode unik dan tidak ada foto yang tertimpa kolom FOTO_BARANG.' }));
      return;
    }
    var h = { kosong: 0, kembar: 0, manual: 0 };
    daftar.forEach(function (d) { d.m.forEach(function (x) { h[x.jenis]++; }); });
    box.appendChild(el('p', { class: 'meta', text: daftar.length + ' barang perlu diperiksa · kode kosong: ' + h.kosong + ' · kode kembar: ' + h.kembar + ' · FOTO_BARANG terisi: ' + h.manual }));
    var blok = el('section', { class: 'tingkat' });
    daftar.forEach(function (d) {
      blok.appendChild(el('button', {
        type: 'button', class: 'baris',
        onclick: function () { $('q').value = d.it.nama; tutupSaran(); tampilSatu(d.it); }
      }, [
        el('span', { class: 'nama', text: d.it.nama + (d.it.kode ? ' (' + d.it.kode + ')' : '') }),
        el('span', { class: 'masalah-ket', text: d.m.map(function (x) { return x.jenis === 'kosong' ? 'kode kosong' : x.jenis === 'kembar' ? 'kode kembar' : 'FOTO_BARANG terisi'; }).join(' · ') })
      ]));
    });
    box.appendChild(blok);
    window.scrollTo(0, 0);
  }

  function pasangTombolAdmin() {
    var bar = $('adminBar');
    bar.innerHTML = '';
    var g = $('gembok');
    g.hidden = modeDemo;
    g.classList.toggle('aktif', modeLogin());
    g.setAttribute('aria-label', modeLogin() ? 'Akun ' + (namaAdmin || '') + ' aktif, ketuk untuk keluar' : 'Masuk mode admin');
    if (modeDemo) { return; }
    if (modeLogin()) {
      bar.appendChild(el('button', { type: 'button', class: 'tambah', text: 'Stock opname' + (antreanSaya().length ? ' (' + antreanSaya().length + ' menunggu)' : ''), onclick: opDaftar }));
    }
    if (modeAdmin()) {
      bar.appendChild(el('button', { type: 'button', class: 'tambah', text: 'Tambah barang', onclick: function () { formTambah(); } }));
    }
    if (modeAdmin() && semua.length) {
      var n = semuaMasalah().length;
      bar.appendChild(el('button', {
        type: 'button', class: 'periksa',
        text: n ? 'Periksa data (' + n + ' masalah)' : 'Periksa data (aman ✓)',
        onclick: tampilMasalah
      }));
    }
    bar.appendChild(el('button', {
      type: 'button',
      text: modeLogin() ? 'Keluar' + (namaAdmin ? ' (' + namaAdmin + (peranAdmin === 'petugas' ? ', petugas' : '') + ')' : '') : 'Mode admin',
      onclick: modeLogin() ? keluarDenganCek : masukAdmin
    }));
  }

  function masukAdmin() {
    bukaForm({
      judul: 'Masuk mode admin',
      catatan: 'Masukkan PIN pribadi Anda. Nama Anda tercatat di Riwayat setiap kali mengubah data.',
      kolom: [{ k: 'pin', label: 'PIN', grup: 'info', wajib: true, rahasia: true }],
      bagian: [{ judul: '', kunci: ['pin'] }],
      nilai: {}, tombol: 'Masuk', fokus: 'pin',
      onSimpan: function (vals) {
        var pin = vals.pin;
        if (!pin) { throw new Error('Isi PIN dulu.'); }
        return kirimKeServer({ aksi: 'cek', pin: pin }).then(function (d) {
          if (!d.ok) { var e = new Error(d.pesan || 'PIN salah.'); e.kode = d.error === 'ADMIN_SALAH' ? 'PIN_SALAH' : d.error; throw e; }
          kodeAdmin = pin;
          namaAdmin = d.nama || '';
          peranAdmin = d.peran === 'petugas' ? 'petugas' : 'admin';
          try { localStorage.setItem(KUNCI_ADMIN, JSON.stringify({ pin: pin, nama: namaAdmin, peran: peranAdmin })); } catch (er) { /* abaikan */ }
          pasangTombolAdmin();
          segarkanTampilan();
          setInfo('Masuk sebagai ' + namaAdmin + (peranAdmin === 'petugas' ? ' (petugas hitung).' : '.'));
        });
      }
    });
  }

  function keluarDenganCek() {
    var n = antreanSaya().length;
    var pesan = n ? n + ' hitungan Anda belum terkirim ke server. Kalau keluar, hitungan itu ditahan di HP ini sampai Anda masuk lagi dan ada sinyal. Tetap keluar?'
      : 'Keluar dari akun' + (namaAdmin ? ' ' + namaAdmin : '') + '?';
    if (window.confirm(pesan)) { keluarAdmin(); }
  }

  function keluarAdmin() {
    kodeAdmin = '';
    namaAdmin = '';
    peranAdmin = 'admin';
    try { localStorage.removeItem(KUNCI_ADMIN); } catch (e) { /* abaikan */ }
    pasangTombolAdmin();
    segarkanTampilan();
  }

  function segarkanTampilan() {
    if (terakhir.jenis === 'opname') { opRender(); }
    else if (terakhir.jenis === 'masalah') { tampilMasalah(); }
    else if (terakhir.jenis === 'cari') { tampilHasil(terakhir.q, terakhir.semua); }
    else if (terakhir.jenis === 'rak') { tampilRak(terakhir.rak, false); }
    else if (terakhir.jenis === 'satu') {
      var k = semua.filter(function (x) { return kunciItem(x) === terakhir.kunci; })[0];
      if (k) { tampilSatu(k); }
    }
  }

  // Kecilkan foto: JPEG, sisi terpanjang <= UKURAN_MAKS, kualitas turun bertahap sampai <= TARGET_KB
  function kecilkan(file) {
    return new Promise(function (ok, gagal) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onerror = function () { URL.revokeObjectURL(url); gagal(new Error('File bukan gambar yang valid.')); };
      img.onload = function () {
        URL.revokeObjectURL(url);
        var sisi = UKURAN_MAKS, kual = 0.8;
        (function coba() {
          var skala = Math.min(1, sisi / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * skala);
          c.height = Math.round(img.naturalHeight * skala);
          var g = c.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
          g.drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) {
            if (!b) { gagal(new Error('Gagal memproses foto.')); return; }
            var kb = b.size / 1024;
            if (kb > TARGET_KB && kual > 0.5) { kual -= 0.1; coba(); return; }
            if (kb > TARGET_KB && sisi > 700) { sisi -= 150; kual = 0.7; coba(); return; }
            ok(b);
          }, 'image/jpeg', kual);
        })();
      };
      img.src = url;
    });
  }

  function keBase64(blob) {
    return new Promise(function (ok, gagal) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1]); };
      r.onerror = function () { gagal(new Error('Gagal membaca foto.')); };
      r.readAsDataURL(blob);
    });
  }

  function pilihFoto(it, jenis) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = function () { if (inp.files && inp.files[0]) { unggah(it, jenis, inp.files[0]); } };
    inp.click();
  }

  function unggah(it, jenis, file) {
    setInfo('Mengecilkan foto…');
    kecilkan(file).then(function (blob) {
      setInfo('Mengunggah (' + Math.round(blob.size / 1024) + ' KB)…');
      return kirimFotoBlob(it, jenis, blob);
    }).then(function (d) {
      setInfo('Foto tersimpan: ' + d.nama, '');
    }).catch(function (err) {
      if (err && err.kode === 'ADMIN_SALAH') { keluarAdmin(); }
      setInfo('Upload gagal: ' + (err && err.message ? err.message : err), 'galat');
    });
  }

  // Mengirim satu foto yang sudah dikecilkan, lalu memperbarui data di layar
  var fotoBerjalan = 0;
  function kirimFotoBlob(it, jenis, blob) {
    fotoBerjalan++;
    var tk = norm(bersihAwalan(it.tingkat, 'tingkat'));
    return keBase64(blob).then(function (b64) {
      return kirimKeServer({
        aksi: 'foto', pin: kodeAdmin, jenis: jenis, kode: it.kode, nama: it.nama,
        rak: bersihAwalan(it.rak, 'rak'), tingkat: bersihAwalan(it.tingkat, 'tingkat'), data: b64
      });
    }).then(function (d) {
      if (!d.ok) { var e = new Error(d.pesan || 'Gagal menyimpan foto.'); e.kode = d.error; throw e; }
      var bust = d.url + '&t=' + Date.now(); // paksa browser memuat foto terbaru
      semua.forEach(function (x) {
        if (jenis === 'barang' && x.kode === it.kode) { x.fotoBarang = bust; }
        if (jenis === 'rak' && x._r === it._r && norm(bersihAwalan(x.tingkat, 'tingkat')) === tk) { x.fotoRak = bust; }
        if (jenis === 'lokasi' && x.kode === it.kode) { x.fotoRak = bust; x.fotoLokasi = true; }
      });
      simpanLokal(semua);
      fotoBerjalan--;
      if (!fotoBerjalan) { segarkanTampilan(); }
      return d;
    }, function (err) { fotoBerjalan--; throw err; });
  }

  /* ---------- Edit info, pindah posisi, tambah barang ---------- */

  var KUNCI_PENGUBAH = 'gudang_pengubah_v1';
  var KUNCI_POSISI = { rak: 1, rak_id: 1, tingkat: 1, kolom: 1 };

  function nilaiKolom(it, c) {
    var k = c.k;
    if (c.wajib) { return it.nama || ''; }
    if (k === 'kategori') { return it.kategori || ''; }
    if (k === 'kata_kunci') { return it.kataKunci || ''; }
    if (k === 'dekat_dengan' || k === 'dekat') { return it.dekat || ''; }
    if (k === 'rak' || k === 'rak_id') { return it.rak || ''; }
    if (k === 'tingkat') { return it.tingkat || ''; }
    if (k === 'kolom') { return it.kolom || ''; }
    if (k === 'stok') { return it.stok || ''; }
    if (k === 'satuan') { return it.satuan || ''; }
    if (k === 'stok_min') { return it.stokMin || ''; }
    return (it.info && it.info[c.label]) || '';
  }

  function perbaruiHapusQ() { $('hapusQ').hidden = !$('q').value; }

  function tutupPilihRak() {
    var p = $('pilihRak');
    p.classList.remove('buka');
    p.innerHTML = '';
  }

  function tutupForm() {
    var m = $('formModal');
    m.classList.remove('buka');
    m.innerHTML = '';
    tutupPilihRak();
    document.body.style.overflow = '';
  }

  function lokasiTeks(rak, tingkat, kolom) {
    var p = [];
    if (rak) { p.push('Rak ' + bersihAwalan(rak, 'rak')); }
    if (tingkat) { p.push('Tingkat ' + bersihAwalan(tingkat, 'tingkat')); }
    if (kolom) { p.push('Kolom ' + bersihAwalan(kolom, 'kolom')); }
    return p.join(' · ') || 'belum diisi';
  }

  // tingkat/kolom dianggap angka kalau semua isi yang ada di data berupa angka
  function angkaSemua(f) {
    return semua.every(function (x) { var v = String(x[f] || '').trim(); return !v || /^\d+$/.test(v); });
  }

  function daftarRakPilihan() {
    var peta = {}, urut = [];
    semua.forEach(function (x) {
      var r = String(x.rak || '').trim();
      if (!r) { return; }
      var k = norm(r);
      if (!peta[k]) { peta[k] = { nilai: r, n: 0, nama: '' }; urut.push(k); }
      peta[k].n++;
      if (!peta[k].nama && x.rakNama) { peta[k].nama = x.rakNama; }
    });
    return urut.map(function (k) { return peta[k]; })
      .sort(function (a, b) { return a.nilai.localeCompare(b.nilai, 'id', { numeric: true }); });
  }

  // Layar pemilih rak: tombol besar + kotak cari + rak baru + kosongkan
  function bukaPilihRak(sekarang, onPilih) {
    var p = $('pilihRak');
    p.innerHTML = '';
    var sheet = el('div', { class: 'rak-sheet' });
    sheet.appendChild(el('div', { class: 'sheet-kepala' }, [
      el('h3', { text: 'Pilih rak' }),
      el('button', { type: 'button', class: 'sheet-x', 'aria-label': 'Tutup pilihan rak', text: '×', onclick: tutupPilihRak })
    ]));
    var cariInp = el('input', { type: 'search', placeholder: 'Cari rak…', 'aria-label': 'Cari rak', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'search' });
    var daftar = el('div', { class: 'rak-pilih' });
    var semuaRak = daftarRakPilihan();
    function pilih(v) { tutupPilihRak(); onPilih(v); }
    function gambar() {
      daftar.innerHTML = '';
      var q = norm(cariInp.value);
      var cocok = semuaRak.filter(function (r) { return !q || norm(r.nilai + ' ' + r.nama).indexOf(q) !== -1; });
      cocok.forEach(function (r) {
        daftar.appendChild(el('button', {
          type: 'button', class: 'rak-opsi' + (norm(r.nilai) === norm(sekarang) ? ' dipakai' : ''),
          onclick: function () { pilih(r.nilai); }
        }, [
          el('b', { text: 'Rak ' + bersihAwalan(r.nilai, 'rak') }),
          el('small', { text: (r.nama ? r.nama + ' · ' : '') + r.n + ' barang' })
        ]));
      });
      if (!cocok.length) { daftar.appendChild(el('p', { class: 'meta', text: 'Tidak ada rak yang cocok. Pakai "+ Rak baru" di bawah.' })); }
    }
    cariInp.addEventListener('input', gambar);
    var baruInp = el('input', { type: 'text', placeholder: 'Nama rak baru, misalnya F', 'aria-label': 'Nama rak baru', autocomplete: 'off', autocapitalize: 'characters' });
    sheet.appendChild(cariInp);
    sheet.appendChild(daftar);
    sheet.appendChild(el('p', { class: 'sheet-label', text: '+ Rak baru' }));
    sheet.appendChild(el('div', { class: 'rak-baru' }, [
      baruInp,
      el('button', { type: 'button', text: 'Pakai', onclick: function () { var v = baruInp.value.trim(); if (v) { pilih(v); } } })
    ]));
    sheet.appendChild(el('button', { type: 'button', class: 'rak-kosong', text: 'Kosongkan rak (lokasi belum diketahui)', onclick: function () { pilih(''); } }));
    p.appendChild(sheet);
    p.classList.add('buka');
    gambar();
  }

  // Petunjuk di bawah kolom nama: "Sudah ada" (sama persis) atau "Mirip"
  function petunjukNamaUntuk(kodeSendiri, namaAwal) {
    var lokasi = function (x) { var l = lokasiRingkas(x); return x.nama + (l ? ' (' + l + ')' : ''); };
    var bukanSendiri = function (x) { return String(x.kode || '') !== String(kodeSendiri || '') || !kodeSendiri; };
    return function (teks) {
      var q = norm(teks);
      if (q.length < 3 || (namaAwal && q === norm(namaAwal))) { return null; }
      var sama = semua.filter(function (x) { return x._n === q && bukanSendiri(x); });
      if (sama.length) {
        return { jenis: 'sama', teks: 'Sudah ada: ' + sama.slice(0, 2).map(lokasi).join('; ') + (sama.length > 2 ? ' dan ' + (sama.length - 2) + ' lainnya' : '') };
      }
      var mirip = cari(teks).filter(bukanSendiri).slice(0, 3);
      if (mirip.length < 3) { mirip = mirip.concat(cariKira(teks, mirip).filter(bukanSendiri)).slice(0, 3); }
      return mirip.length ? { jenis: 'mirip', teks: 'Mirip: ' + mirip.map(lokasi).join('; ') } : null;
    };
  }

  // Panduan foto setelah barang tersimpan: foto barang, lalu foto posisi di rak. Resolve setelah selesai/dilewati.
  function langkahFoto(it) {
    return new Promise(function (selesai) {
      var langkah = [
        { jenis: 'barang', judul: 'Foto barang', petunjuk: 'Foto bendanya dari dekat, terang, dan jelas.' },
        { jenis: 'lokasi', judul: 'Foto posisi di rak', petunjuk: 'Foto tempat barang ini disimpan di rak.' }
      ];
      var idx = 0, w = $('wizFoto'), urlLama = '';
      function tutup() {
        if (urlLama) { URL.revokeObjectURL(urlLama); urlLama = ''; }
        w.classList.remove('buka');
        w.innerHTML = '';
        selesai();
      }
      function gagalKirim(L) {
        return function (err) {
          if (err && err.kode === 'ADMIN_SALAH') { keluarAdmin(); }
          setInfo(L.judul + ' gagal diunggah: ' + (err && err.message ? err.message : err) + '. Coba lagi lewat tombol di kartu barang.', 'galat');
        };
      }
      function tampil() {
        if (urlLama) { URL.revokeObjectURL(urlLama); urlLama = ''; }
        if (idx >= langkah.length) { tutup(); return; }
        var L = langkah[idx], blob = null;
        w.innerHTML = '';
        var kotak = el('div', { class: 'form-kotak' });
        var pratinjau = el('div', { class: 'wiz-pratinjau' }, [el('span', { text: 'Belum ada foto' })]);
        var galat = el('div', { class: 'form-galat', role: 'alert' });
        var pakai = el('button', { type: 'button', text: 'Pakai foto ini' });
        pakai.disabled = true;
        var kamera = el('button', { type: 'button', text: 'Ambil foto' });
        function pilihBerkas(pakaiKamera) {
          var inp = document.createElement('input');
          inp.type = 'file';
          inp.accept = 'image/*';
          if (pakaiKamera) { inp.setAttribute('capture', 'environment'); }
          inp.onchange = function () {
            if (!inp.files || !inp.files[0]) { return; }
            galat.textContent = '';
            pratinjau.innerHTML = '';
            pratinjau.appendChild(el('span', { text: 'Memproses foto…' }));
            kecilkan(inp.files[0]).then(function (b) {
              blob = b;
              if (urlLama) { URL.revokeObjectURL(urlLama); }
              urlLama = URL.createObjectURL(b);
              pratinjau.innerHTML = '';
              pratinjau.appendChild(el('img', { src: urlLama, alt: 'Pratinjau foto' }));
              pakai.disabled = false;
              kamera.textContent = 'Ulangi foto';
            }).catch(function (e) {
              pratinjau.innerHTML = '';
              pratinjau.appendChild(el('span', { text: 'Belum ada foto' }));
              galat.textContent = e && e.message ? e.message : String(e);
            });
          };
          inp.click();
        }
        kamera.addEventListener('click', function () { pilihBerkas(true); });
        pakai.addEventListener('click', function () {
          if (!blob) { return; }
          setInfo('Mengunggah ' + L.judul.toLowerCase() + ' di latar belakang…');
          kirimFotoBlob(it, L.jenis, blob).then(function () { setInfo('Foto tersimpan.'); }, gagalKirim(L));
          idx++;
          tampil();
        });
        kotak.appendChild(el('div', { class: 'sheet-kepala' }, [
          el('h3', { text: 'Langkah ' + (idx + 1) + ' dari ' + langkah.length + ': ' + L.judul }),
          el('button', { type: 'button', class: 'sheet-x', 'aria-label': 'Tutup panduan foto', text: '×', onclick: tutup })
        ]));
        kotak.appendChild(el('div', { class: 'form-isi' }, [
          el('p', { class: 'meta', text: it.nama + ' (kode ' + it.kode + '). ' + L.petunjuk }),
          pratinjau,
          el('div', { class: 'wiz-aksi' }, [kamera, el('button', { type: 'button', text: 'Dari galeri', onclick: function () { pilihBerkas(false); } })])
        ]));
        kotak.appendChild(el('div', { class: 'form-kaki' }, [
          galat,
          el('div', { class: 'form-tombol' }, [el('button', { type: 'button', text: 'Lewati', onclick: function () { idx++; tampil(); } }), pakai])
        ]));
        w.appendChild(kotak);
        w.classList.add('buka');
      }
      tampil();
    });
  }

  // o: { judul, catatan, sukses, kolom, bagian:[{judul, kunci:[], lipat}], nilai, tombol, tombolLagi, fokus, opsi:{teks,nilai},
  //      pratinjau(vals)->[lama, baru], petunjukNama(teks)->{jenis,teks}, onSimpan(vals, namaAdmin, mode, opsi) }
  function bukaForm(o) {
    var m = $('formModal');
    m.innerHTML = '';
    var olehKunci = {};
    o.kolom.forEach(function (c) { olehKunci[c.k] = c; });
    var form = el('form', { class: 'form-kotak', autocomplete: 'off' });
    form.appendChild(el('div', { class: 'sheet-kepala' }, [
      el('h3', { text: o.judul }),
      el('button', { type: 'button', class: 'sheet-x', 'aria-label': 'Tutup formulir', text: '×', onclick: tutupForm })
    ]));
    var isi = el('div', { class: 'form-isi' });
    if (o.sukses) { isi.appendChild(el('div', { class: 'sukses', role: 'status', text: o.sukses })); }
    if (o.catatan) { isi.appendChild(el('p', { class: 'meta', text: o.catatan })); }
    var inputs = {};
    var pratinjau = o.pratinjau ? el('div', { class: 'pratinjau', 'aria-live': 'polite' }) : null;
    if (pratinjau) { isi.appendChild(pratinjau); }

    function segarPratinjau() {
      if (!pratinjau) { return; }
      var v = {};
      Object.keys(inputs).forEach(function (k) { v[k] = inputs[k].value.trim(); });
      var t = o.pratinjau(v);
      pratinjau.innerHTML = '';
      pratinjau.appendChild(el('div', {}, ['Sekarang: ', el('b', { text: t[0] })]));
      pratinjau.appendChild(el('div', {}, ['Menjadi: ', el('b', { text: t[1] })]));
    }

    function buatField(c) {
      var id = 'f-' + c.k;
      var nilai = (o.nilai && o.nilai[c.k]) || '';
      var kotak = el('div', { class: 'field' });
      if (c.k === 'rak' || c.k === 'rak_id') {
        var hid = el('input', { type: 'hidden', id: id, value: nilai });
        var tb = el('button', { type: 'button', class: 'rak-tombol', 'aria-label': c.label + ': pilih' });
        var isiTombol = function () {
          tb.innerHTML = '';
          tb.appendChild(el('span', { text: hid.value ? 'Rak ' + bersihAwalan(hid.value, 'rak') : 'Pilih rak…' }));
          tb.appendChild(el('span', { text: '▾', 'aria-hidden': 'true' }));
        };
        isiTombol();
        tb.addEventListener('click', function () {
          bukaPilihRak(hid.value, function (v) { hid.value = v; isiTombol(); segarPratinjau(); });
        });
        inputs[c.k] = hid;
        kotak.appendChild(el('label', { text: c.label + (c.wajib ? ' *' : ''), onclick: function () { tb.click(); } }));
        kotak.appendChild(hid);
        kotak.appendChild(tb);
        return kotak;
      }
      if (c.pilihan) {
        var sel = el('select', { id: id });
        c.pilihan.forEach(function (p) { sel.appendChild(el('option', { value: p, text: p })); });
        sel.value = nilai || c.pilihan[0];
        inputs[c.k] = sel;
        kotak.appendChild(el('label', { 'for': id, text: c.label + (c.wajib ? ' *' : '') }));
        kotak.appendChild(sel);
        return kotak;
      }
      var props = { type: c.rahasia ? 'password' : 'text', id: id, value: nilai };
      if (c.desimal) { props.inputmode = 'decimal'; }
      if (c.k === 'tingkat' || c.k === 'kolom') {
        props.autocapitalize = 'off';
        if (angkaSemua(c.k)) { props.inputmode = 'numeric'; }
      }
      var inp = el('input', props);
      inp.addEventListener('input', segarPratinjau);
      inputs[c.k] = inp;
      kotak.appendChild(el('label', { 'for': id, text: c.label + (c.wajib ? ' *' : '') }));
      kotak.appendChild(inp);
      if (c.wajib && o.petunjukNama) {
        var ph = el('div', { class: 'petunjuk', role: 'status', 'aria-live': 'polite' });
        var tunda = null;
        var periksa = function () {
          var t = o.petunjukNama(inp.value);
          ph.className = 'petunjuk' + (t ? ' ' + t.jenis : '');
          ph.textContent = t ? t.teks : '';
        };
        inp.addEventListener('input', function () { clearTimeout(tunda); tunda = setTimeout(periksa, 150); });
        kotak.appendChild(ph);
        periksa();
      }
      return kotak;
    }

    o.bagian.forEach(function (b) {
      var ks = b.kunci.filter(function (k) { return olehKunci[k]; });
      if (!ks.length) { return; }
      var wadah;
      if (b.lipat) {
        wadah = el('details', { class: 'lipat' }, [el('summary', { text: b.judul })]);
        if (ks.some(function (k) { return o.nilai && o.nilai[k]; })) { wadah.open = true; }
      } else {
        wadah = el('section', { class: 'bagian' }, b.judul ? [el('h4', { text: b.judul })] : []);
      }
      var lewat = {};
      ks.forEach(function (k) {
        if (lewat[k]) { return; }
        if (k === 'tingkat' && ks.indexOf('kolom') !== -1) {
          lewat.kolom = true;
          wadah.appendChild(el('div', { class: 'dua' }, [buatField(olehKunci.tingkat), buatField(olehKunci.kolom)]));
        } else {
          wadah.appendChild(buatField(olehKunci[k]));
        }
      });
      isi.appendChild(wadah);
    });

    var centang = null;
    if (o.opsi) {
      centang = el('input', { type: 'checkbox' });
      centang.checked = !!o.opsi.nilai;
      isi.appendChild(el('label', { class: 'centang' }, [centang, o.opsi.teks]));
    }
    form.appendChild(isi);

    var mode = '';
    var galat = el('div', { class: 'form-galat', role: 'alert' });
    var simpan = el('button', { type: 'submit', text: o.tombol || 'Simpan', onclick: function () { mode = ''; } });
    var lagi = o.tombolLagi ? el('button', { type: 'submit', class: 'lagi', text: o.tombolLagi, onclick: function () { mode = 'lagi'; } }) : null;
    form.appendChild(el('div', { class: 'form-kaki' }, [
      galat,
      el('div', { class: 'form-tombol' }, [el('button', { type: 'button', text: 'Batal', onclick: tutupForm }), simpan, lagi])
    ]));

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var vals = {};
      o.kolom.forEach(function (c) { if (inputs[c.k]) { vals[c.k] = inputs[c.k].value.trim(); } });
      var modeKirim = mode;
      mode = '';
      galat.textContent = '';
      var semuaTombol = form.querySelectorAll('.form-tombol button');
      Array.prototype.forEach.call(semuaTombol, function (t) { t.disabled = true; });
      simpan.textContent = 'Menyimpan…';
      new Promise(function (ok) { ok(o.onSimpan(vals, namaAdmin, modeKirim, centang ? centang.checked : undefined)); }).then(function () {
        tutupForm();
      }).catch(function (err) {
        Array.prototype.forEach.call(semuaTombol, function (t) { t.disabled = false; });
        simpan.textContent = o.tombol || 'Simpan';
        if (err && err.kode === 'ADMIN_SALAH') { tutupForm(); keluarAdmin(); setInfo('PIN ditolak server. Masuk mode admin lagi.', 'galat'); return; }
        if (err && err.batal) { return; }
        galat.textContent = (err && err.message) ? err.message : String(err);
      });
    });

    m.appendChild(form);
    m.classList.add('buka');
    document.body.style.overflow = 'hidden';
    segarPratinjau();
    if (o.fokus && inputs[o.fokus]) { inputs[o.fokus].focus(); }
  }

  function kirimAksi(aksi, pengubah, kode, perubahan) {
    return kirimKeServer({ aksi: aksi, pin: kodeAdmin, kode: kode || '', perubahan: perubahan })
      .then(function (d) {
        if (!d.ok) { var e = new Error(d.pesan || 'Gagal menyimpan.'); e.kode = d.error; throw e; }
        return d;

  var KUNCI_FOTO_LANGSUNG = 'gudang_foto_langsung_v1';

  // awal: isian yang sudah terisi (dari barang sebelumnya); sukses: pesan hijau di atas form

      onSimpan: function (vals, peng, mode, foto) {

        if (!kunciNama || !ubah[kunciNama.k]) { throw new Error('Nama barang wajib diisi.'); }

          return ambilDariServer().then(function (items) {

          } else if (hasil.it) {

  /* ---------- Stock opname ---------- */

  var KUNCI_ANTREAN = 'gudang_antrean_v1';
  var KUNCI_OPCACHE = 'gudang_opcache_v1';

  try { antrean = JSON.parse(localStorage.getItem(KUNCI_ANTREAN) || '[]') || []; } catch (e) { antrean = []; }
  try { opCache = JSON.parse(localStorage.getItem(KUNCI_OPCACHE) || '{}') || {}; } catch (e) { opCache = {}; }

  var sinkronJalan = false;
  var sinkronGagal = '';

  function antreanSaya() { return antrean.filter(function (a) { return a.oleh === namaAdmin; }); }   // yang dikirim hanya milik akun yang sedang masuk
  function simpanAntrean() { try { localStorage.setItem(KUNCI_ANTREAN, JSON.stringify(antrean)); } catch (e) { /* abaikan */ } }
  function simpanOpCache() { try { localStorage.setItem(KUNCI_OPCACHE, JSON.stringify(opCache)); } catch (e) { /* abaikan */ } }

  // Angka dari isian orang: koma = desimal ("2,5"), titik tiga digit = ribuan ("1.234"). NaN kalau bukan angka.
  function angka(v) {
    if (typeof v === 'number') { return isFinite(v) ? v : NaN; }
    var t = String(v === null || v === undefined ? '' : v).trim().replace(/\s/g, '');
    if (!t) { return NaN; }
    if (t.indexOf(',') > -1 && t.indexOf('.') > -1) {
      t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
    } else if (/^\d{1,3}(\.\d{3})+$/.test(t)) {
      t = t.replace(/\./g, '');
    } else {
      t = t.replace(',', '.');
    }
    return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
  }
  function fmtAngka(n) { return String(Math.round(n * 1000) / 1000).replace('.', ','); }
  function bulat3(n) { return Math.round(n * 1000) / 1000; }
  function perluUlang(stok, jumlah) {
    var s = isNaN(stok) ? 0 : stok;
    var sel = Math.abs(jumlah - s);
    return sel > 0 && sel >= Math.max(BATAS_ULANG_UNIT, BATAS_ULANG_PERSEN * s);
  }

  function postOp(aksi, data) {
    return kirimKeServer(Object.assign({ aksi: aksi, pin: kodeAdmin }, data || {})).then(function (d) {
      if (!d.ok) { var e = new Error(d.pesan || 'Gagal.'); e.kode = d.error; e.data = d; throw e; }
      return d;
    });
  }
  function galatOp(err) {
    if (err && err.kode === 'ADMIN_SALAH') { keluarAdmin(); }
    return (err && err.message) ? err.message : String(err);
  }

  /* ---- data & status ---- */

  function lingkup() { return semua.filter(function (x) { return x.kode && x.rak; }); }
  function efektif(r) { return r.ulang !== null && r.ulang !== undefined ? r.ulang : r.jumlah; }

  // Baris hasil dari satu hitungan yang masih antre (dipakai untuk tampilan dan untuk menggabung setelah terkirim)
  function barisDariAntrean(a, r) {
    var j = a.item.status === 'tidak_ada' ? 0 : a.item.jumlah;
    if (a.item.ulang && r) {
      var c = Object.assign({}, r);
      c.ulang = j; c.olehUlang = a.oleh || namaAdmin; c.menunggu = true;
      return c;
    }
    return {
      kode: a.item.kode, nama: a.item.nama, rak: a.item.rak, stok: r ? r.stok : null, jumlah: j,
      status: a.item.status === 'tidak_ada' ? 'Tidak ditemukan' : a.item.status === 'temuan' ? 'Temuan' : 'Dihitung',
      catatan: a.item.catatan || '', oleh: a.oleh || namaAdmin, ulang: null, olehUlang: '', menunggu: true
    };
  }

  function hasilPeta(tanpaAntrean) {
    var p = {};
    ((opData && opData.hasil) || []).forEach(function (r) { p[kunciKode(r.kode)] = r; });
    if (!tanpaAntrean && opData) {
      antrean.forEach(function (a) {
        if (a.sesi !== opData.sesi.id || a.oleh !== namaAdmin) { return; }
        var k = kunciKode(a.item.kode);
        p[k] = barisDariAntrean(a, p[k]);
      });
    }
    return p;
  }

  function stokSistem(it, r) {
    if (r && r.stok !== null && r.stok !== undefined) { return r.stok; }
    var s = angka(it.stok);
    return isNaN(s) ? 0 : s;
  }

  function statusOp(it, r) {
    if (!r || r.status === 'Temuan') { return { kelas: 'belum', teks: 'Belum dihitung · stok ' + (it.stok || '0') }; }
    var tunggu = r.menunggu ? ' ⏳' : '';
    if (r.status === 'Tidak ditemukan') { return { kelas: 'selisih', teks: 'Tidak ditemukan' + tunggu }; }
    var st = stokSistem(it, r), j = efektif(r), sel = bulat3(j - st);
    if (sel === 0) { return { kelas: 'sesuai', teks: '✓ ' + fmtAngka(j) + tunggu }; }
    var ul = (r.ulang === null || r.ulang === undefined) && perluUlang(st, r.jumlah);
    return { kelas: ul ? 'ulang' : 'selisih', teks: fmtAngka(j) + ' · selisih ' + (sel > 0 ? '+' : '') + fmtAngka(sel) + (ul ? ' · hitung ulang' : '') + tunggu };
  }

  function butuhUlang(it, r) {
    return !!(r && r.status === 'Dihitung' && (r.ulang === null || r.ulang === undefined) && perluUlang(stokSistem(it, r), r.jumlah));
  }

  function kunciRakOp(r) { return norm(bersihAwalan(r, 'rak')); }
  function rakBerlingkup() {
    var p = {}, u = [];
    lingkup().forEach(function (x) {
      var k = kunciRakOp(x.rak);
      if (!p[k]) { p[k] = { kunci: k, nama: String(x.rak).trim(), items: [] }; u.push(k); }
      p[k].items.push(x);
    });
    return u.map(function (k) { return p[k]; }).sort(function (a, b) { return a.nama.localeCompare(b.nama, 'id', { numeric: true }); });
  }
  function petugasRak(kunci) {
    var t = ((opData && opData.tugas) || []).filter(function (x) { return kunciRakOp(x.rak) === kunci; })[0];
    return t ? t.petugas : '';
  }
  function urutLetak(a, b) {
    return String(a.tingkat).localeCompare(String(b.tingkat), 'id', { numeric: true }) ||
      String(a.kolom).localeCompare(String(b.kolom), 'id', { numeric: true }) || a.nama.localeCompare(b.nama, 'id');
  }
  function progres(peta, daftar) {
    var sudah = 0;
    daftar.forEach(function (x) { var r = peta[kunciKode(x.kode)]; if (r && r.status !== 'Temuan') { sudah++; } });
    return { sudah: sudah, total: daftar.length };
  }
  function barProgres(p, awalan) {

      el('div', { class: 'op-label', text: awalan + p.sudah + ' dari ' + p.total + ' barang sudah dihitung (' + pct + '%) · belum: ' + (p.total - p.sudah) })
    ]);

  /* ---- pengiriman & antrean (aman saat sinyal putus) ---- */

  function opBarSinkron() {
    var n = antreanSaya().length;
    var teks = n ? '⏳ ' + n + ' hitungan menunggu dikirim' + (navigator.onLine === false ? ' (tidak ada sinyal)' : '') + (sinkronGagal ? ' · ' + sinkronGagal : '')
      : '✓ Semua hitungan sudah tersimpan di server';

    return el('div', { class: 'op-sinkron' + (n ? ' tunggu' : ''), id: 'opSinkron', role: 'status' }, anak);
  }
  function opPerbaruiSinkron() {
    var e = $('opSinkron');

      var baru = opBarSinkron();

  function tambahAntrean(item) {
    var sesi = opData.sesi.id;
    antrean = antrean.filter(function (a) {
      return !(a.sesi === sesi && a.oleh === namaAdmin && kunciKode(a.item.kode) === kunciKode(item.kode) && !!a.item.ulang === !!item.ulang);
    });
    antrean.push({ sesi: sesi, item: item, oleh: namaAdmin, t: Date.now() });

  function sinkron(manual) {
    if (sinkronJalan || !antreanSaya().length || !kodeAdmin) { return Promise.resolve(); }

    sinkronJalan = true;
    sinkronGagal = '';

    var paket = milik.filter(function (a) { return a.sesi === sesi; }).slice(0, 200);
    return kirimKeServer({ aksi: 'hitung_kirim', pin: kodeAdmin, sesi: sesi, daftar: paket.map(function (a) { return a.item; }) }).then(function (d) {
      if (!d.ok) { var e = new Error(d.pesan || 'Gagal mengirim.'); e.kode = d.error; throw e; }
      var ditolak = {};
      (d.ditolak || []).forEach(function (x) { ditolak[kunciKode(x.kode)] = x.alasan; });
      // gabungkan ke data lokal supaya tampilan tidak berubah, lalu keluarkan dari antrean
      if (opData && opData.sesi.id === sesi) {
        paket.forEach(function (a) {

          opData.hasil.forEach(function (r, n) { if (kunciKode(r.kode) === k) { i = n; } });
          var baru = barisDariAntrean(a, i >= 0 ? opData.hasil[i] : null);

      simpanAntrean();
      if ((d.ditolak || []).length) {

      }

      if (err && err.kode === 'SESI_TUTUP') {

        simpanAntrean();
        setInfo(err.message, 'peringatan');
        return true;
      }
      if (err && err.kode === 'ADMIN_SALAH') { keluarAdmin(); }

      if (terakhir.jenis === 'opname' && !sedangMengetik) { opRender(); }
      if (sukses && antreanSaya().length) { return sinkron(); }
    });
  }

  function opMuat(id, diam) {
    return postOp('sesi_data', { sesi: id }).then(function (d) {

    }, function (err) {

  /* ---- layar ---- */

  function opAwal(judul, kembali) {

  function opRender() {
    var n = opTampil.nama;

  /* ---- tinjau selisih (admin) ---- */

  function ringkasHasil() {
    var peta = hasilPeta(), ling = lingkup(), info = {};
    semua.forEach(function (x) { if (x.kode) { info[kunciKode(x.kode)] = x; } });
    var sel = [], ulang = [], sesuai = [], belum = [];
    ling.forEach(function (it) {
      var r = peta[kunciKode(it.kode)];
      if (!r || r.status === 'Temuan') { belum.push(it); return; }
      var st = stokSistem(it, r), j = r.status === 'Tidak ditemukan' ? 0 : efektif(r), d = bulat3(j - st);
      var baris = { it: it, r: r, st: st, j: j, d: d };
      if (d === 0) { sesuai.push(baris); } else { sel.push(baris); if (butuhUlang(it, r)) { ulang.push(baris); } }
    });
    return { sel: sel, ulang: ulang, sesuai: sesuai, belum: belum, peta: peta };
  }

  /* ---- hitung satu barang ---- */

  function barangBerikut(it, konteks) {
    if (!konteks || !konteks.length) { return null; }
    var peta = hasilPeta(), i = konteks.indexOf(it);
    for (var n = 1; n <= konteks.length; n++) {
      var c = konteks[(i + n) % konteks.length];
      if (c !== it && c.kode && !peta[kunciKode(c.kode)]) { return c; }
    }
    return null;
  }

  function bukaHitung(it, konteks) {
    if (!opData || opData.sesi.status !== 'Berjalan') { window.alert('Sesi sudah ditutup. Hitungan baru tidak diterima.'); return; }
    var peta = hasilPeta(), r = peta[kunciKode(it.kode)], st = stokSistem(it, r);
    var perlu = butuhUlang(it, r), modeUlang = perlu && r.oleh !== namaAdmin;
    var m = $('formModal');
    m.innerHTML = '';
    var form = el('form', { class: 'form-kotak', autocomplete: 'off' });
    form.appendChild(el('div', { class: 'sheet-kepala' }, [
      el('h3', { text: modeUlang ? 'Hitung ulang' : 'Hitung stok' }),
      el('button', { type: 'button', class: 'sheet-x', 'aria-label': 'Tutup', text: '×', onclick: tutupForm })
    ]));
    var isi = el('div', { class: 'form-isi' });
    isi.appendChild(el('p', { class: 'meta', style: 'font-weight:700;font-size:1.05rem;color:var(--laut-tua)', text: it.nama }));
    isi.appendChild(el('p', { class: 'meta', text: lokasiTeks(it.rak, it.tingkat, it.kolom) + ' · kode ' + it.kode }));
    isi.appendChild(el('p', { class: 'pratinjau' }, ['Stok sistem: ', el('b', { text: it.stok ? it.stok + (it.satuan ? ' ' + it.satuan : '') : 'belum diisi (dianggap 0)' })]));
    if (r && r.status !== 'Temuan') {
      var tek = 'Sudah dihitung oleh ' + (r.oleh || '-') + ': ' + (r.status === 'Tidak ditemukan' ? 'tidak ditemukan' : fmtAngka(r.jumlah));
      if (r.ulang !== null && r.ulang !== undefined) { tek += ' · hitung ulang oleh ' + (r.olehUlang || '-') + ': ' + fmtAngka(r.ulang); }
      isi.appendChild(el('p', { class: 'meta', text: tek }));
    }
