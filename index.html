        '<Relationship Id="rId' + (lap.bagian.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { nama: 'xl/styles.xml', isi: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + ns + '"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3F3F8"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' }
    ];
    lap.bagian.forEach(function (b, i) { berkas.push({ nama: 'xl/worksheets/sheet' + (i + 1) + '.xml', isi: xmlLembar(b) }); });
    return buatZip(berkas, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }

  // ----- PDF: dokumen sederhana (teks Helvetica, tabel, halaman A4 landscape) -----
  function buatPdf(lap) {
    var W = 842, H = 595, M = 36, LH = 11.5, FS = 7.5;
    var hal = [], cur = null, y = 0;
    function enc(s) { return String(s === null || s === undefined ? '' : s).replace(/[^\x20-\x7E\xA0-\xFF]/g, '?').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
    function tx(x, yy, f, uk, teks) { return 'BT /' + f + ' ' + uk + ' Tf ' + x.toFixed(1) + ' ' + yy.toFixed(1) + ' Td (' + enc(teks) + ') Tj ET'; }
    function nilai(v) { return typeof v === 'number' ? fmtAngka(v) : String(v === null || v === undefined ? '' : v); }
    function pot(teks, w) { var maks = Math.max(1, Math.floor((w - 4) / (FS * 0.5))); teks = String(teks); return teks.length > maks ? teks.substr(0, Math.max(1, maks - 2)) + '..' : teks; }
    function halamanBaru() { cur = []; hal.push(cur); y = H - M; cur.push(tx(M, y, 'F2', 12, lap.judul)); y -= 22; }
    function kepala(b, kol, lanjut) {
      if (y < M + 50) { halamanBaru(); }
      cur.push(tx(M, y, 'F2', 9.5, b.judul + (lanjut ? ' (lanjutan)' : '')));
      y -= 14;
      var x = M;
      kol.forEach(function (k) { cur.push(tx(x, y, 'F2', FS, pot(k.t, k.w))); x += k.w; });
      y -= 3;
      cur.push('0.4 w ' + M + ' ' + y.toFixed(1) + ' m ' + (W - M) + ' ' + y.toFixed(1) + ' l S');
      y -= LH - 1;
    }
    halamanBaru();
    lap.bagian.forEach(function (b) {
      var idx = [], kol = [];
      b.kolom.forEach(function (k, i) { if (k.pdf !== false) { idx.push(i); kol.push(k); } });
      kepala(b, kol, false);
      if (!b.baris.length) { cur.push(tx(M, y, 'F1', FS, '(kosong)')); y -= LH; }
      b.baris.forEach(function (baris) {
        if (y < M + LH + 14) { halamanBaru(); kepala(b, kol, true); }
        var x = M;
        idx.forEach(function (i, n) { cur.push(tx(x, y, 'F1', FS, pot(nilai(baris[i]), kol[n].w))); x += kol[n].w; });
        y -= LH;
      });
      y -= 12;
    });
    var objs = [], jml = hal.length;
    objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[2] = '<< /Type /Pages /Kids [' + hal.map(function (p, i) { return (5 + i * 2) + ' 0 R'; }).join(' ') + '] /Count ' + jml + ' >>';
    objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    hal.forEach(function (p, i) {
      var isi = p.join('\n') + '\n' + tx(M, 20, 'F1', 7, 'Halaman ' + (i + 1) + ' dari ' + jml);
      objs[5 + i * 2] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (6 + i * 2) + ' 0 R >>';
      objs[6 + i * 2] = '<< /Length ' + isi.length + ' >>\nstream\n' + isi + '\nendstream';
    });
    var out = '%PDF-1.4\n', pos = [];
    for (var n = 1; n < objs.length; n++) { pos[n] = out.length; out += n + ' 0 obj\n' + objs[n] + '\nendobj\n'; }
    var xref = out.length;
    out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
    for (var m = 1; m < objs.length; m++) { out += ('0000000000' + pos[m]).slice(-10) + ' 00000 n \n'; }
    out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    var u8 = new Uint8Array(out.length);
    for (var i = 0; i < out.length; i++) { u8[i] = out.charCodeAt(i) & 0xFF; }
    return new Blob([u8], { type: 'application/pdf' });
  }

  /* ---------- Memuat data ---------- */

  function bacaLokal() {
    try {
      var s = localStorage.getItem(KUNCI_LOKAL);
      if (!s) { return null; }
      var o = JSON.parse(s);
      return o && o.items && o.items.length ? o : null;
    } catch (e) { return null; }
  }
  function simpanLokal(items) {
    try { localStorage.setItem(KUNCI_LOKAL, JSON.stringify({ t: Date.now(), items: items, kolomForm: kolomForm })); } catch (e) { /* abaikan */ }
  }

  function ambilDariServer() {
    var url = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'k=' + encodeURIComponent(KODE_AKSES);
    var pengendali = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var batas = setTimeout(function () { if (pengendali) { pengendali.abort(); } }, 20000);
    return fetch(url, pengendali ? { signal: pengendali.signal } : undefined)
      .then(function (r) {
        clearTimeout(batas);
        if (!r.ok) {
          var eh = new Error('server membalas kode ' + r.status);
          eh.kode = 'HTTP';
          throw eh;
        }
        return r.json();
      })
      .then(function (d) {
        if (!d.ok) {
          var e = new Error(d.pesan || 'Terjadi kesalahan di server.');
          e.kode = d.error;
          throw e;
        }
        kolomForm = d.kolomForm || kolomForm;
        return d.items || [];
      });
  }

  function dataSiap() {
    bangunRakNav();
    pasangTombolAdmin();
    $('subjudul').textContent = semua.length + ' barang tercatat';
    if (awalSudahDiproses) {
      segarkanTampilan();
      if (!$('saran').hidden) { tampilSaran(); }
      return;
    }
    awalSudahDiproses = true;
    var param = new URLSearchParams(window.location.search);
    var q = param.get('q');
    var rak = param.get('rak');
    if (q) { $('q').value = q; tampilHasil(q); }
    else if (rak) { tampilRak(rak, false); }
  }

  function muat() {
    var param = new URLSearchParams(window.location.search);
    if (param.get('k')) { KODE_AKSES = param.get('k'); }

    if (!API_URL || API_URL.indexOf('GANTI_') === 0) {
      modeDemo = true;
      semua = siapkan(DATA_DEMO);
      dataSiap();
      pasangTombolAdmin();
      setStale('MODE DEMO: yang dicari hanya data contoh, BUKAN data spreadsheet Anda. Isi API_URL di file index.html dengan URL web app Apps Script.');
      return;
    }

    var lokal = bacaLokal();
    if (lokal) {
      semua = siapkan(lokal.items);
      kolomForm = lokal.kolomForm || [];
      dataSiap();
    } else {
      setInfo('Memuat data barang…');
    }
    setStale('');

    ambilDariServer().then(function (items) {
      semua = siapkan(items);
      simpanLokal(items);
      setStale('');
      if (!lokal && terakhir.jenis === 'beranda') { setInfo(''); }
      dataSiap();
      if (!items.length) { setInfo('Belum ada barang di spreadsheet.', 'peringatan'); }
    }).catch(function (err) {
      if (err && err.kode === 'KODE_SALAH') {
        setInfo(err.message, 'galat');
        return;
      }
      if (lokal) {
        setStale('Tidak bisa terhubung ke server. Yang tampil adalah data tersimpan terakhir, mungkin belum yang terbaru.', { label: 'Coba lagi', aksi: muat });
        if (terakhir.jenis === 'beranda') { setInfo(''); }
      } else {
        var sebab = (err && err.kode && err.message) ? err.message : 'tidak bisa terhubung ke server (periksa sinyal atau URL Apps Script)';
        setInfo('Gagal memuat data: ' + sebab + '. ', 'galat', { label: 'Coba lagi', aksi: muat });
      }
    });
  }

  /* ---------- Pasang kejadian ---------- */

  $('gembok').addEventListener('click', function () {
    if (modeLogin()) {
      keluarDenganCek();
    } else { masukAdmin(); }
  });
  $('q').addEventListener('input', tampilSaran);
  $('q').addEventListener('input', perbaruiHapusQ);
  $('hapusQ').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('hapusQ').addEventListener('click', function () {
    $('q').value = '';
    tutupSaran();
    perbaruiHapusQ();
    $('q').focus();
  });
  $('q').addEventListener('focus', function () { if (norm($('q').value)) { tampilSaran(); } });
  $('q').addEventListener('keydown', function (e) {
    var buka = !$('saran').hidden;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!buka) { tampilSaran(); }
      aktifkanSaran(saranAktif + 1);
    } else if (e.key === 'ArrowUp') {
      if (buka) { e.preventDefault(); aktifkanSaran(saranAktif - 1); }
    } else if (e.key === 'Enter') {
      if (buka && saranAktif >= 0 && saranData[saranAktif]) { e.preventDefault(); pilihSaran(saranData[saranAktif]); }
    } else if (e.key === 'Escape') {
      if (buka) { tutupSaran(); }
    }
  });
  document.addEventListener('pointerdown', function (e) {
    if (!$('cariWrap').contains(e.target)) { tutupSaran(); }
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    tutupSaran();
    tampilHasil($('q').value);
    $('q').blur();
  });
  $('tutupFoto').addEventListener('click', tutupFoto);
  $('lightbox').addEventListener('click', function (e) { if (e.target === this) { tutupFoto(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { tutupFoto(); } });

  var tickerEl = $('ticker');
  tickerEl.addEventListener('touchstart', function () { tickerEl.classList.add('jeda'); }, { passive: true });
  ['touchend', 'touchcancel'].forEach(function (nm) {
    tickerEl.addEventListener(nm, function () { tickerEl.classList.remove('jeda'); }, { passive: true });
  });
  var tundaUkur = null;
  window.addEventListener('resize', function () {
    clearTimeout(tundaUkur);
    tundaUkur = setTimeout(pasangTicker, 250);
  });

  window.addEventListener('online', function () { sinkron(true); });
  window.addEventListener('offline', opPerbaruiSinkron);
  setInterval(function () { sinkron(); }, 20000);
  setInterval(function () {   // lihat hitungan petugas lain, hanya saat layar opname terbuka dan tidak sedang mengetik
    var buka = $('formModal').classList.contains('buka') || (document.activeElement && document.activeElement.tagName === 'INPUT');
    if (terakhir.jenis === 'opname' && opData && opTampil.nama !== 'daftar' && !antreanSaya().length && !buka && navigator.onLine !== false && modeLogin()) {
      opMuat(opData.sesi.id, true).then(function () { if (terakhir.jenis === 'opname') { opRender(); } }, function () { /* abaikan */ });
    }
  }, 60000);
  terapkanMerek();
  pasangTombolAdmin();
  muat();
  if (antreanSaya().length && modeLogin()) { sinkron(); }
  window.addEventListener('load', ukurTicker);
})();
</script>
